<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline Estaciones Q3-Q4 2026 + Q1 2027 - Cano Sur Este</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#02040a;--bg-1:#050916;--bg-2:#0a1024;
  --panel:rgba(12,18,40,.78);--stroke:rgba(70,211,255,.16);--stroke-2:rgba(70,211,255,.08);
  --text:#e8f9ff;--text-2:#9fbbd8;--muted:#5f7194;
  --cyan:#00e5ff;--violet:#b26bff;--good:#22ffb8;--warn:#ffd23f;--bad:#ff3d7f;--orange:#ff8c42;--lime:#a6ff00;
  --label-w:430px;--row-h:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}
body{overflow-x:hidden}
.num{font-family:'Orbitron',sans-serif;font-variant-numeric:tabular-nums}
.bg-aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(ellipse at top,#0a1a3a 0%,#050914 55%,#020408 100%)}
.bg-aurora i{position:absolute;border-radius:50%;filter:blur(160px);opacity:.33;mix-blend-mode:screen;animation:float 28s ease-in-out infinite}
.bg-aurora i:nth-child(1){width:1200px;height:1200px;background:radial-gradient(circle,#00e5ff 0%,transparent 60%);top:-420px;left:-380px}
.bg-aurora i:nth-child(2){width:1100px;height:1100px;background:radial-gradient(circle,#b26bff 0%,transparent 60%);bottom:-520px;right:-380px;animation-delay:-10s}
.bg-aurora i:nth-child(3){width:800px;height:800px;background:radial-gradient(circle,#ff3d7f 0%,transparent 60%);top:40%;left:45%;opacity:.14;animation-delay:-18s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(140px,-100px) scale(1.1)}66%{transform:translate(-120px,110px) scale(.9)}}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.wrap{max-width:1880px;margin:0 auto;padding:0 28px 60px}

/* ---------- header ---------- */
.hdr{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.6}
.hdr h1{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(90deg,#fff 0%,var(--cyan) 45%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,229,255,.35))}
.hdr .sub{font-size:12px;color:var(--text-2);margin-top:7px;letter-spacing:1px}
.hdr .sub b{color:var(--cyan)}
.hdr .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--stroke);background:rgba(0,229,255,.06);color:var(--text-2)}
.chip.live{color:var(--good);border-color:rgba(34,255,184,.45);background:rgba(34,255,184,.08)}
.chip.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:20px 0 6px}
@media(max-width:1300px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{position:relative;padding:14px 16px;border-radius:14px;background:linear-gradient(150deg,rgba(18,28,58,.8),rgba(8,13,32,.9));border:1px solid var(--stroke);overflow:hidden;color:var(--k,var(--cyan))}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:currentColor;box-shadow:0 0 14px currentColor}
.kpi::after{content:'';position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:currentColor;opacity:.08;filter:blur(20px)}
.kpi .l{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.kpi .v{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;margin-top:6px;color:currentColor;text-shadow:0 0 16px currentColor}
.kpi .s{font-size:10.5px;color:var(--text-2);margin-top:2px}

/* ---------- aliado cards ---------- */
.aliados{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:1300px){.aliados{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.aliados{grid-template-columns:1fr}}
.acard{position:relative;padding:13px 16px 12px;border-radius:14px;cursor:pointer;color:var(--c);background:linear-gradient(140deg,rgba(20,30,60,.75),rgba(10,16,36,.9));border:1px solid rgba(255,255,255,.06);transition:.25s cubic-bezier(.4,0,.2,1);overflow:hidden}
.acard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);box-shadow:0 0 16px var(--c)}
.acard:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 36px -10px var(--c)}
.acard.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 14px 40px -8px var(--c)}
.acard.dim{opacity:.4}
.acard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acard .n{font-family:'Orbitron',sans-serif;font-size:12.5px;font-weight:800;letter-spacing:1.4px;text-shadow:0 0 10px var(--c)}
.acard .cnt{font-size:10px;color:var(--text-2);margin-top:3px;letter-spacing:.6px}
.acard .pc{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 12px var(--c)}
.acard .pc small{font-size:10px;color:var(--text-2);font-family:'Inter';font-weight:700;display:block;text-align:right;letter-spacing:.8px}
.dbar{position:relative;height:7px;border-radius:4px;background:rgba(0,0,0,.45);margin-top:9px;overflow:visible}
.dbar .e{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c);box-shadow:0 0 10px var(--c)}
.dbar .p{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;box-shadow:0 0 6px #fff;border-radius:1px}
.acard .foot{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;border:1px solid currentColor;background:rgba(0,0,0,.25)}
.tag.ok{color:var(--good)}.tag.at{color:var(--bad)}.tag.pg{color:var(--cyan)}.tag.pd{color:var(--muted)}.tag.rc{color:var(--warn)}

/* ---------- radar ---------- */
.radar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 16px}
@media(max-width:1100px){.radar{grid-template-columns:1fr}}
.rbox{border-radius:14px;background:var(--panel);border:1px solid var(--stroke);overflow:hidden}
.rbox h3{font-family:'Orbitron',sans-serif;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;padding:12px 16px;border-bottom:1px solid var(--stroke-2);display:flex;justify-content:space-between;align-items:center;color:var(--h)}
.rbox h3 span{font-family:'Inter';font-size:10px;color:var(--text-2);letter-spacing:.8px}
.rlist{max-height:260px;overflow:auto}
.ritem{display:grid;grid-template-columns:8px 1fr auto auto;gap:10px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--stroke-2);cursor:pointer;font-size:12px}
.ritem:hover{background:rgba(0,229,255,.06)}
.ritem .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.ritem .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .d small{display:block;color:var(--text-2);font-size:10px}
.ritem .f{font-family:'JetBrains Mono';font-size:11px;color:var(--text-2)}
.ritem .x{font-family:'Orbitron';font-size:11px;font-weight:800;min-width:48px;text-align:right}
.rempty{padding:18px;color:var(--muted);font-size:12px;text-align:center}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 14px;margin:0 -14px 14px;background:rgba(3,6,16,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--stroke)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.3px;font-weight:800}
.fld select,.fld input{background:rgba(10,20,40,.85);color:var(--text);border:1px solid rgba(0,229,255,.25);border-radius:9px;padding:8px 11px;font-size:12px;outline:none;font-family:inherit;min-width:150px}
.fld input{min-width:170px}
.fld select{min-width:130px}
.fld select:focus,.fld input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.seg{display:inline-flex;border:1px solid rgba(0,229,255,.25);border-radius:9px;overflow:hidden;background:rgba(10,20,40,.85)}
.seg button{background:none;border:0;color:var(--text-2);font:800 10.5px 'Inter';letter-spacing:.8px;padding:9px 11px;cursor:pointer;text-transform:uppercase}
.seg button+button{border-left:1px solid rgba(0,229,255,.15)}
.seg button.on{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(178,107,255,.25));color:#fff;text-shadow:0 0 8px var(--cyan)}
.btn{background:rgba(10,20,40,.85);border:1px solid rgba(0,229,255,.3);color:var(--cyan);border-radius:9px;padding:8px 12px;font:800 10.5px 'Inter';letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn:hover{background:rgba(0,229,255,.12);box-shadow:0 0 14px rgba(0,229,255,.3)}
.btn.hot{background:linear-gradient(135deg,var(--bad),var(--orange));border:0;color:#fff}
.tgl{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-2);cursor:pointer;user-select:none;padding:8px 2px}
.tgl input{accent-color:var(--cyan);width:15px;height:15px}
.spacer{flex:1}

.leyenda{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--text-2);margin:0 0 12px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:10px;border-radius:3px;display:inline-block}

/* ---------- panel ---------- */
.panel{margin:0 0 18px;border-radius:16px;background:linear-gradient(160deg,rgba(14,21,46,.72),rgba(7,11,28,.92));border:1px solid var(--stroke);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);position:relative}
.panel::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--c),transparent 70%);box-shadow:0 0 18px var(--c);z-index:3}
.ph{display:flex;align-items:center;gap:16px;padding:14px 18px;cursor:pointer;flex-wrap:wrap;border-bottom:1px solid var(--stroke-2);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 60%)}
.ph .chev{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--c);color:var(--c);font-size:13px;transition:transform .25s;box-shadow:0 0 12px -2px var(--c)}
.panel.closed .ph .chev{transform:rotate(-90deg)}
.ph .nm{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;letter-spacing:2.4px;color:var(--c);text-shadow:0 0 14px var(--c)}
.ph .inf{font-size:11px;color:var(--text-2);margin-top:3px;letter-spacing:.5px}
.ph .gauge{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pk{padding:6px 11px;border-radius:9px;background:rgba(5,10,24,.7);border:1px solid var(--stroke);text-align:center;min-width:64px}
.pk .v{font-family:'Orbitron';font-size:15px;font-weight:900;color:var(--kc,var(--c))}
.pk .l{font-size:8.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.ph .mini{display:flex;gap:6px}
.ph .mini button{background:rgba(5,10,24,.7);border:1px solid var(--stroke);color:var(--text-2);border-radius:8px;padding:6px 9px;font:800 9.5px 'Inter';letter-spacing:.6px;cursor:pointer;text-transform:uppercase}
.ph .mini button:hover{color:var(--c);border-color:var(--c)}
.pbody{max-height:72vh;overflow:auto;position:relative}
.panel.closed .pbody{display:none}
.pbody::-webkit-scrollbar{height:10px;width:10px}
.pbody::-webkit-scrollbar-track{background:rgba(5,10,24,.6)}
.pbody::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--c),var(--violet));border-radius:5px}

/* ---------- gantt grid ---------- */
.gantt{position:relative;min-width:100%}
.grow{display:flex;height:var(--row-h);position:relative}
.gl{position:sticky;left:0;z-index:6;flex:0 0 var(--label-w);width:var(--label-w);display:flex;align-items:center;gap:6px;padding-right:10px;background:#070c1f;border-right:1px solid var(--stroke);border-bottom:1px solid var(--stroke-2);font-size:12px;white-space:nowrap;overflow:hidden}
.gt{position:relative;flex:0 0 auto;border-bottom:1px solid var(--stroke-2)}
.ghead{height:56px;position:sticky;top:0;z-index:8}
.ghead .gl{z-index:9;background:#081028;font:800 10px 'Inter';letter-spacing:1.4px;text-transform:uppercase;color:var(--text-2);padding-left:16px;justify-content:space-between}
.ghead .gt{background:#081028}
.mo{position:absolute;top:6px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.22);color:var(--cyan);font:800 10px 'Orbitron';letter-spacing:2px;overflow:hidden;white-space:nowrap}
.mo.q1{color:var(--violet);border-color:rgba(178,107,255,.35);background:rgba(178,107,255,.08)}
.wk{position:absolute;top:33px;transform:translateX(-50%);font:600 9.5px 'JetBrains Mono';color:var(--text-2)}
.gridlayer{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.gridlayer .ml{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,229,255,.16)}
.gridlayer .today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 12px var(--bad),0 0 2px #fff;z-index:2}
.gridlayer .today::before{content:'HOY';position:absolute;top:36px;left:4px;background:var(--bad);color:#fff;padding:1px 5px;border-radius:4px;font:800 8.5px 'Orbitron';letter-spacing:1px;box-shadow:0 0 10px var(--bad)}
.gridlayer .shut{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,210,63,.07) 0 6px,transparent 6px 12px);border-left:1px dashed rgba(255,210,63,.4);border-right:1px dashed rgba(255,210,63,.4)}

/* row label */
.grow.r1 .gl{font-weight:800;color:#fff;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,#070c1f),#070c1f 70%)}
.grow.r1 .gl::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
.grow.r2 .gl{font-weight:600;color:#dbeeff}
.grow.r3 .gl{font-weight:500;color:var(--text-2);font-size:11.5px}
.grow:hover .gl{background:#0d1736}
.grow:hover .gt{background:rgba(0,229,255,.035)}
.grow.hit .gl .tx{color:var(--warn)}
.tw{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;border-radius:6px;font-size:10px;color:var(--c);cursor:pointer;border:1px solid transparent;transition:.2s}
.tw:hover{border-color:var(--c);box-shadow:0 0 10px -2px var(--c)}
.tw.open{transform:rotate(90deg)}
.tw.leaf{cursor:default;color:var(--muted);font-size:7px}
.tw.leaf:hover{border-color:transparent;box-shadow:none}
.gl .tx{flex:1;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gl .tx:hover{color:var(--cyan)}
.kc{font:700 9px 'Inter';color:var(--text-2);background:rgba(255,255,255,.06);border-radius:5px;padding:1px 5px}
.rcb{font:900 8.5px 'Inter';color:#1a1300;background:var(--warn);border-radius:4px;padding:1px 4px;box-shadow:0 0 8px rgba(255,210,63,.6)}
.pe{font:800 10px 'Orbitron';min-width:42px;text-align:right}

/* bars */
.bar{position:absolute;top:7px;height:16px;border-radius:5px;cursor:pointer;z-index:3;color:var(--bc);transition:transform .15s,filter .15s}
.bar .bg{position:absolute;inset:0;border-radius:5px;background:var(--bc);opacity:.2;border:1px solid var(--bc)}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--bc) 70%,#fff 0%),var(--bc));box-shadow:0 0 10px var(--bc)}
.bar .pm{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;border-radius:1px;box-shadow:0 0 6px #fff;opacity:.85}
.bar:hover{transform:scaleY(1.2);filter:brightness(1.25);z-index:7}
.r1 .bar{top:6px;height:18px}
.r1 .bar .bg{opacity:.28;border-width:1.5px}
.r1 .bar::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-5px;height:4px;border-left:2px solid var(--bc);border-right:2px solid var(--bc);border-bottom:2px solid var(--bc);border-radius:0 0 3px 3px;opacity:.7}
.r3 .bar{top:9px;height:12px}
.bar .bl{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:7px;white-space:nowrap;font:600 9.5px 'JetBrains Mono';color:var(--text-2);pointer-events:none}
.bar .bl b{color:var(--bc);font-family:'Orbitron';font-size:9.5px}
.bar.ms{width:14px!important;height:14px;top:8px;border-radius:2px;transform:rotate(45deg);background:var(--bc);box-shadow:0 0 12px var(--bc)}
.bar.ms .bg,.bar.ms .fill,.bar.ms .pm{display:none}
.bar.ms .bl{transform:rotate(-45deg) translate(4px,-8px);transform-origin:left}
.bar.ms:hover{transform:rotate(45deg) scale(1.25)}
.gt.hasoob{display:flex;align-items:center}
.oob.r{margin-left:auto;right:6px}
.oob{position:sticky;left:calc(var(--label-w) + 6px);height:16px;display:flex;align-items:center;gap:4px;font:700 9.5px 'JetBrains Mono';color:var(--text-2);padding:0 6px;border-radius:4px;border:1px dashed rgba(159,187,216,.35);background:rgba(5,10,24,.7);cursor:pointer;z-index:3;white-space:nowrap}
.oob b{color:var(--bc)}

.empty{padding:26px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:1px}

/* tooltip */
.tip{position:fixed;z-index:200;pointer-events:none;min-width:240px;max-width:380px;padding:11px 13px;border-radius:12px;background:rgba(6,10,26,.96);border:1px solid var(--tc,var(--cyan));box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 22px -6px var(--tc,var(--cyan));opacity:0;transition:opacity .12s;font-size:11.5px}
.tip.on{opacity:1}
.tip .t{font-weight:800;color:#fff;margin-bottom:6px;line-height:1.35}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--text-2);margin-top:2px}
.tip .r b{color:#fff;font-family:'JetBrains Mono';font-weight:700}

/* modal */
.mback{position:fixed;inset:0;background:rgba(2,4,10,.8);backdrop-filter:blur(8px);z-index:300;opacity:0;pointer-events:none;transition:.2s}
.mback.on{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#0a1024,#050916);border:1px solid var(--mc,var(--cyan));border-radius:18px;z-index:301;transition:.22s cubic-bezier(.4,0,.2,1);box-shadow:0 30px 100px rgba(0,0,0,.85),0 0 60px -10px var(--mc,var(--cyan));overflow:hidden}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.mh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--stroke);background:linear-gradient(90deg,color-mix(in srgb,var(--mc,var(--cyan)) 14%,transparent),transparent)}
.mh .al{font-family:'Orbitron';font-size:12px;letter-spacing:2px;color:var(--mc);text-shadow:0 0 10px var(--mc)}
.mh .crumb{font-size:10.5px;color:var(--text-2);margin-top:4px}
.mh h2{font-size:16px;color:#fff;margin-top:6px;line-height:1.35}
.mx{flex:0 0 34px;height:34px;border-radius:10px;border:1px solid rgba(255,61,127,.45);background:rgba(255,61,127,.12);color:#ff8fb0;font-size:16px;cursor:pointer}
.mx:hover{transform:rotate(90deg)}

    ['Ruta crítica abierta', rc, 'actividades RC con Ejec < 100%', 'var(--orange)']
  ];
  document.getElementById('kpis').innerHTML = K.map(k => '<div class="kpi" style="--k:' + k[3] + '"><div class="l">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="s">' + k[2] + '</div></div>').join('');
}
function renderCards(){
  document.getElementById('aliados').innerHTML = DATA.aliados.map(al => {
    const s = ST[al], c = COLORS[al], d = (s.ejec - s.prog) * 100;
    const cls = S.aliado === al ? 'active' : (S.aliado ? 'dim' : '');
    return '<div class="acard ' + cls + '" data-al="' + esc(al) + '" style="--c:' + c + '">'
      + '<div class="top"><div><div class="n">' + esc(al) + '</div><div class="cnt">' + s.madres + ' madres &middot; ' + s.total + ' actividades &middot; fin ' + fdate(s.fin) + '</div></div>'
      + '<div class="pc">' + (s.ejec * 100).toFixed(0) + '%<small>PROG ' + (s.prog * 100).toFixed(0) + '%</small></div></div>'
      + '<div class="dbar"><div class="e" style="width:' + (s.ejec * 100).toFixed(1) + '%"></div><div class="p" style="left:' + (s.prog * 100).toFixed(1) + '%"></div></div>'
      + '<div class="foot"><span class="tag ' + (d < -5 ? 'at' : 'ok') + '">Δ ' + (d > 0 ? '+' : '') + d.toFixed(1) + ' pp</span><span class="tag ok">' + s.nComp + ' compl.</span><span class="tag pg">' + s.nProg + ' en curso</span><span class="tag at">' + s.nAtr + ' atraso</span>' + (s.rc ? '<span class="tag rc">' + s.rc + ' RC</span>' : '') + '</div>'
      + '</div>';
  }).join('');
}
document.getElementById('aliados').addEventListener('click', e => {
  const el = e.target.closest('.acard'); if (!el) return;
  const al = el.dataset.al; S.aliado = S.aliado === al ? '' : al; document.getElementById('fAliado').value = S.aliado; renderAll();
  if (S.aliado) { PCLOSED.delete(al); renderAll(); document.getElementById('panels').scrollIntoView({behavior:'smooth'}); }
});
function renderRadar(){
  const pool = DATA.aliados.filter(al => !S.aliado || S.aliado === al).flatMap(al => DATA.todo[al]).filter(a => !a._kids.length);
  const soon = pool.filter(a => { const f = new Date(a.fin + 'T00:00:00'); return (a.pctEjec || 0) < .995 && f >= TODAY && (f - TODAY) / DAY <= 30; }).sort((a, b) => a.fin < b.fin ? -1 : 1).slice(0, 40);
  const late = pool.filter(a => estado(a) === 'atr').sort((a, b) => ((b.pctProg - b.pctEjec) - (a.pctProg - a.pctEjec))).slice(0, 40);
  const item = (a, right, col) => '<div class="ritem" data-al="' + esc(a._al) + '" data-id="' + a.id + '" style="--c:' + COLORS[a._al] + '"><i class="dot"></i><div class="d">' + esc(a.descripcion) + '<small>' + esc(a._al) + ' &middot; ' + esc((anc(a).slice(-1)[0] || {}).descripcion || '') + '</small></div><div class="f">' + fdate(a.fin) + '</div><div class="x" style="color:' + col + '">' + right + '</div></div>';
  document.getElementById('radar').innerHTML =
    '<div class="rbox" style="--h:var(--warn)"><h3>&#9201; Vencen en los próximos 30 días <span>' + soon.length + ' actividades</span></h3><div class="rlist">' + (soon.map(a => item(a, pct(a.pctEjec) + '%', estado(a) === 'atr' ? 'var(--bad)' : 'var(--cyan)')).join('') || '<div class="rempty">Sin vencimientos en 30 días</div>') + '</div></div>'
  + '<div class="rbox" style="--h:var(--bad)"><h3>&#9888; Mayor atraso (Prog - Ejec) <span>' + late.length + ' actividades</span></h3><div class="rlist">' + (late.map(a => item(a, '-' + Math.round((a.pctProg - a.pctEjec) * 100) + ' pp', 'var(--bad)')).join('') || '<div class="rempty">Sin atrasos</div>') + '</div></div>';
}
document.getElementById('radar').addEventListener('click', e => { const el = e.target.closest('.ritem'); if (el) openModal(el.dataset.al, +el.dataset.id); });

// --- filtros ---
const fA = document.getElementById('fAliado');
fA.innerHTML = '<option value="">Todos</option>' + DATA.aliados.map(a => '<option>' + esc(a) + '</option>').join('');
fA.onchange = e => { S.aliado = e.target.value; renderAll(); };
document.getElementById('fEstado').onchange = e => { S.estado = e.target.value; renderAll(); };
let tSearch; document.getElementById('fSearch').oninput = e => { clearTimeout(tSearch); tSearch = setTimeout(() => { S.search = e.target.value.toLowerCase().trim(); renderAll(); }, 180); };
document.getElementById('fRC').onchange = e => { S.rc = e.target.checked; renderAll(); };
document.getElementById('fLegacy').onchange = e => { S.legacy = e.target.checked; renderAll(); };
document.getElementById('bReset').onclick = () => { Object.assign(S, {aliado:'', estado:'', search:'', rc:false, legacy:true});
  fA.value = ''; document.getElementById('fEstado').value = ''; document.getElementById('fSearch').value = ''; document.getElementById('fRC').checked = false; document.getElementById('fLegacy').checked = true; renderAll(); };
document.querySelectorAll('#segNivel button').forEach(b => b.onclick = () => {
  const n = +b.dataset.n;
  DATA.aliados.forEach(al => { OPEN[al] = new Set(DATA.todo[al].filter(a => a._kids.length && a.nivel < n).map(a => a.id)); });
  saveOpen(); renderAll(); markSeg();
});
document.querySelectorAll('#segZoom button').forEach(b => b.onclick = () => { PX = +b.dataset.z; store.set('px', PX); renderAll(); goToday(); });
function markSeg(){ document.querySelectorAll('#segZoom button').forEach(b => b.classList.toggle('on', +b.dataset.z === PX)); }
document.getElementById('bHoy').onclick = () => goToday(true);
const saveOpen = () => { const o = {}; DATA.aliados.forEach(al => o[al] = [...OPEN[al]]); store.set('open', o); };
const filtering = () => !!(S.estado || S.search || S.rc);
function matches(a){
  if (S.estado && estado(a) !== S.estado) return false;
  if (S.rc && a.ruta !== 'Sí') return false;
  if (S.search && !a.descripcion.toLowerCase().includes(S.search)) return false;
  return true;
}
function visibleRows(al){
  const L = DATA.todo[al] || [];
  const okLegacy = a => !(S.legacy && a._legacy);
  if (filtering()) {
    const keep = new Set(), hit = new Set();
    L.forEach(a => { if (okLegacy(a) && matches(a)) { hit.add(a.id); keep.add(a.id); anc(a).forEach(p => keep.add(p.id)); } });
    return { rows: L.filter(a => keep.has(a.id)), hit, forced:true };
  }
  const rows = L.filter(a => okLegacy(a) && anc(a).every(p => OPEN[al].has(p.id) && okLegacy(p)));
  return { rows, hit:new Set(), forced:false };
}

// --- panel ---
const W = () => DAYS * PX;
function headerHTML(){
  let h = '';
  MONTHS.forEach(m => { const s = Math.max(0, Math.round((m - Q_START) / DAY)); const e = Math.min(DAYS - 1, Math.round((new Date(m.getFullYear(), m.getMonth() + 1, 0) - Q_START) / DAY));
    const q1 = m.getFullYear() === 2027;
    h += '<div class="mo' + (q1 ? ' q1' : '') + '" style="left:' + (s * PX + 2) + 'px;width:' + ((e - s + 1) * PX - 4) + 'px">' + MES[m.getMonth()].toUpperCase() + (PX >= 7 ? ' &middot; ' + m.getFullYear() : '') + '</div>'; });
  for (let d = 0; d < DAYS; d++) { const dt = new Date(Q_START.getTime() + d * DAY); if (dt.getDay() === 1 && (PX >= 7 || dt.getDate() <= 7)) h += '<div class="wk" style="left:' + (d * PX + PX / 2) + 'px">' + dt.getDate() + '</div>'; }
  return h;
}
function gridHTML(){
  let h = '';
  MONTHS.forEach(m => { const s = Math.round((m - Q_START) / DAY); if (s > 0) h += '<div class="ml" style="left:' + (s * PX) + 'px"></div>'; });
  const s0 = dIdx(SHUT[0]), s1 = dIdx(SHUT[1]); h += '<div class="shut" style="left:' + (s0 * PX) + 'px;width:' + Math.max(PX, (s1 - s0 + 1) * PX) + 'px" title="Parada de planta 10-oct-2026"></div>';
  const t = Math.round((TODAY - Q_START) / DAY); if (t >= 0 && t < DAYS) h += '<div class="today" style="left:' + (t * PX + PX / 2) + 'px"></div>';
  const wk0 = (8 - Q_START.getDay()) % 7;
  return '<div class="gridlayer" style="left:var(--label-w);width:' + W() + 'px;background:repeating-linear-gradient(90deg,transparent 0 ' + (7 * PX - 1) + 'px,rgba(0,229,255,.05) ' + (7 * PX - 1) + 'px ' + (7 * PX) + 'px);background-position:' + (wk0 * PX) + 'px 0">' + h + '</div>';
}
function barHTML(a, c){
  const bc = barColor(a, c), e = pct(a.pctEjec), p = pct(a.pctProg);
  const st = 'data-al="' + esc(a._al) + '" data-id="' + a.id + '"';
  if (a._df < 0) return '<div class="oob" ' + st + ' style="--bc:' + bc + '">&#9664; fin ' + fdate(a.fin) + ' &middot; <b>' + e + '%</b>' + (estado(a) === 'atr' ? ' &middot; <b style="color:var(--bad)">vencida</b>' : '') + '</div>';
  if (a._di >= DAYS) return '<div class="oob r" ' + st + ' style="--bc:' + bc + '">inicia ' + fdate(a.comienzo) + ' &#9654;</div>';
  const s = Math.max(0, a._di), f = Math.min(DAYS - 1, a._df);
  const left = s * PX, w = Math.max(PX, (f - s + 1) * PX);
  const ms = (a.duracion || 0) === 0 && a._di === a._df;
  const lbl = '<div class="bl"><b>' + e + '%</b> &middot; ' + fdate(a.comienzo) + ' &rarr; ' + fdate(a.fin) + (a._di < 0 ? ' &#9664;' : '') + '</div>';
  if (ms) return '<div class="bar ms" ' + st + ' style="left:' + (left + PX / 2 - 7) + 'px;--bc:' + bc + '">' + lbl + '</div>';
  return '<div class="bar" ' + st + ' style="left:' + left + 'px;width:' + w + 'px;--bc:' + bc + '"><div class="bg"></div><div class="fill" style="width:' + e + '%"></div>' + (p > 0 && p < 100 ? '<div class="pm" style="left:calc(' + p + '% - 1px)"></div>' : '') + lbl + '</div>';
}
function renderPanel(al){
  const c = COLORS[al], s = ST[al], v = visibleRows(al);
  const closed = PCLOSED.has(al) && !S.aliado;
  const d = (s.ejec - s.prog) * 100;
  let h = '<section class="panel' + (closed ? ' closed' : '') + '" id="p-' + al.replace(/\W/g, '') + '" data-al="' + esc(al) + '" style="--c:' + c + '">'
    + '<div class="ph" data-act="panel"><div class="chev">&#9660;</div><div><div class="nm">&#127959; ' + esc(al) + '</div>'
    + '<div class="inf">' + s.total + ' actividades &middot; ' + s.madres + ' madres &middot; ' + s.nComp + ' completas &middot; ' + s.nProg + ' en curso &middot; ' + s.nPend + ' pendientes &middot; <span style="color:var(--bad)">' + s.nAtr + ' con atraso</span></div></div>'
    + '<div class="gauge"><div class="pk" style="--kc:var(--good)"><div class="v">' + (s.ejec * 100).toFixed(0) + '%</div><div class="l">Ejecutado</div></div>'
    + '<div class="pk" style="--kc:var(--violet)"><div class="v">' + (s.prog * 100).toFixed(0) + '%</div><div class="l">Programado</div></div>'
    + '<div class="pk" style="--kc:' + (d < -5 ? 'var(--bad)' : 'var(--good)') + '"><div class="v">' + (d > 0 ? '+' : '') + d.toFixed(1) + '</div><div class="l">&Delta; pp</div></div>'
    + '<div class="pk"><div class="v">' + fdate(s.fin) + '</div><div class="l">Fin plan</div></div>'
    + '<div class="mini"><button data-act="exp">&#8862; Expandir</button><button data-act="col">&#8863; Contraer</button></div></div></div>';
  h += '<div class="pbody"><div class="gantt" style="width:calc(var(--label-w) + ' + W() + 'px)">' + gridHTML()
    + '<div class="grow ghead"><div class="gl"><span>Actividad</span><span>% Ejec</span></div><div class="gt" style="width:' + W() + 'px">' + headerHTML() + '</div></div>';
  if (!v.rows.length) h += '<div class="empty">&mdash; Sin actividades con los filtros aplicados &mdash;</div>';
  v.rows.forEach(a => {
    const kids = a._kids.length, open = v.forced || OPEN[al].has(a.id);
    const ec = estado(a), pc = ec === 'comp' ? 'var(--good)' : ec === 'atr' ? 'var(--bad)' : ec === 'pend' ? 'var(--muted)' : c;
    h += '<div class="grow r' + a.nivel + (v.hit.has(a.id) ? ' hit' : '') + '">'
      + '<div class="gl" style="padding-left:' + (8 + (a.nivel - 1) * 20) + 'px">'
      + (kids ? '<span class="tw' + (open ? ' open' : '') + '" data-act="tog" data-id="' + a.id + '">&#9654;</span>' : '<span class="tw leaf">&#9679;</span>')
      + '<span class="tx" data-act="det" data-id="' + a.id + '" title="' + esc(a.descripcion) + '">' + esc(a.descripcion) + '</span>'
      + (kids && !open ? '<span class="kc">' + kids + '</span>' : '')
      + (a.ruta === 'Sí' ? '<span class="rcb">RC</span>' : '')
      + '<span class="pe" style="color:' + pc + '">' + pct(a.pctEjec) + '%</span></div>'
      + '<div class="gt' + (a._df < 0 || a._di >= DAYS ? ' hasoob' : '') + '" style="width:' + W() + 'px">' + barHTML(a, c) + '</div></div>';
  });
  h += '</div></div></section>';
  return h;
}
function renderPanels(){
  const host = document.getElementById('panels');
  const keep = {}; host.querySelectorAll('.panel').forEach(p => { const b = p.querySelector('.pbody'); if (b) keep[p.dataset.al] = [b.scrollLeft, b.scrollTop]; });
  host.innerHTML = DATA.aliados.filter(al => !S.aliado || S.aliado === al).map(renderPanel).join('');
  host.querySelectorAll('.panel').forEach(p => { const b = p.querySelector('.pbody'), k = keep[p.dataset.al]; if (b && k) { b.scrollLeft = k[0]; b.scrollTop = k[1]; } });
}
document.getElementById('panels').addEventListener('click', e => {
  const t = e.target.closest('[data-act],.bar,.oob'); if (!t) return;
  const panel = t.closest('.panel'), al = panel.dataset.al;
  if (t.classList.contains('bar') || t.classList.contains('oob')) return openModal(al, +t.dataset.id);
  const act = t.dataset.act;
  if (act === 'tog') { const id = +t.dataset.id; OPEN[al].has(id) ? OPEN[al].delete(id) : OPEN[al].add(id); saveOpen(); renderPanels(); }
  else if (act === 'det') openModal(al, +t.dataset.id);
  else if (act === 'exp') { e.stopPropagation(); OPEN[al] = new Set(DATA.todo[al].filter(a => a._kids.length).map(a => a.id)); saveOpen(); PCLOSED.delete(al); renderPanels(); }
  else if (act === 'col') { e.stopPropagation(); OPEN[al] = new Set(); saveOpen(); renderPanels(); }
  else if (act === 'panel') { if (e.target.closest('button')) return; PCLOSED.has(al) ? PCLOSED.delete(al) : PCLOSED.add(al); store.set('pclosed', [...PCLOSED]); renderPanels(); }
});
function goToday(smooth){
  const t = Math.round((TODAY - Q_START) / DAY);
  document.querySelectorAll('.pbody').forEach(b => b.scrollTo({ left: Math.max(0, (t - 45) * PX), behavior: smooth ? 'smooth' : 'auto' }));
}

// --- tooltip ---
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const b = e.target.closest('.bar,.oob,.ritem'); if (!b) { tip.classList.remove('on'); return; }
  const a = DATA.todo[b.dataset.al]._byId[+b.dataset.id];
  const d = (a.pctEjec - a.pctProg) * 100;
  tip.style.setProperty('--tc', barColor(a, COLORS[a._al]));
  tip.innerHTML = '<div class="t">' + esc(a.descripcion) + '</div>'
    + '<div class="r"><span>Plan</span><b>' + fdate(a.comienzo) + ' &rarr; ' + fdate(a.fin) + '</b></div>'
    + '<div class="r"><span>Pronóstico</span><b>' + fdate(a.pronostico) + '</b></div>'
    + '<div class="r"><span>Prog / Ejec</span><b>' + pct(a.pctProg) + '% / ' + pct(a.pctEjec) + '%</b></div>'
    + '<div class="r"><span>&Delta;</span><b style="color:' + (d < -5 ? 'var(--bad)' : 'var(--good)') + '">' + (d > 0 ? '+' : '') + d.toFixed(1) + ' pp</b></div>'
    + '<div class="r"><span>Nivel &middot; Ruta crítica</span><b>N' + a.nivel + ' &middot; ' + a.ruta + '</b></div>';
  tip.classList.add('on');
});
document.addEventListener('mousemove', e => { if (!tip.classList.contains('on')) return;
  const x = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 10), y = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; });

// --- modal ---
function openModal(al, id){
  const a = DATA.todo[al]._byId[id]; if (!a) return;
  const c = COLORS[al], e = pct(a.pctEjec), p = pct(a.pctProg), d = (a.pctEjec - a.pctProg) * 100;
  const m = document.getElementById('modal'); m.style.setProperty('--mc', c);
  document.getElementById('mAl').textContent = al + ' · Nivel ' + a.nivel;
  document.getElementById('mCrumb').textContent = anc(a).map(x => x.descripcion).join('  ›  ') || 'Actividad madre';
  document.getElementById('mTitle').textContent = a.descripcion;
  const I = [['Comienzo', fdate(a.comienzo)], ['Fin plan', fdate(a.fin)], ['Pronóstico', fdate(a.pronostico)], ['Duración', (a.duracion || 0) + ' días'], ['Ruta crítica', a.ruta], ['Estado', {comp:'Completa', atr:'Con atraso', prog:'En progreso', pend:'Pendiente'}[estado(a)]]];
  let h = '<div class="dg">' + I.map(i => '<div class="di"><div class="k">' + i[0] + '</div><div class="v">' + esc(i[1]) + '</div></div>').join('') + '</div>'
    + '<div class="pb"><div class="row"><span>Programado</span><b style="color:var(--violet)">' + p + '%</b></div><div class="tr"><i style="width:' + p + '%;background:var(--violet);box-shadow:0 0 8px var(--violet)"></i></div>'
    + '<div class="row"><span>Ejecutado</span><b style="color:var(--good)">' + e + '%</b></div><div class="tr"><i style="width:' + e + '%;background:var(--good);box-shadow:0 0 8px var(--good)"></i></div>'
    + '<div class="row"><span>&Delta; Ejecutado - Programado</span><b style="color:' + (d < -5 ? 'var(--bad)' : 'var(--good)') + '">' + (d > 0 ? '+' : '') + d.toFixed(1) + ' pp</b></div></div>';
  if (a._kids.length) h += '<div class="kids"><h4>' + a._kids.length + ' actividades hijas</h4>' + a._kids.map(k => { const kc = barColor(k, c);
      return '<div class="kid" data-id="' + k.id + '"><span>' + esc(k.descripcion) + '</span><div class="mb2"><i style="width:' + pct(k.pctEjec) + '%;background:' + kc + ';box-shadow:0 0 6px ' + kc + '"></i></div><span class="x" style="color:' + kc + '">' + pct(k.pctEjec) + '%</span></div>'; }).join('') + '</div>';
  const mb = document.getElementById('mBody'); mb.innerHTML = h;
  mb.querySelectorAll('.kid').forEach(k => k.onclick = () => openModal(al, +k.dataset.id));
  m.classList.add('on'); document.getElementById('mback').classList.add('on'); tip.classList.remove('on');
}
const closeModal = () => { document.getElementById('modal').classList.remove('on'); document.getElementById('mback').classList.remove('on'); };
document.getElementById('mx').onclick = closeModal; document.getElementById('mback').onclick = closeModal;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function renderAll(){ renderCards(); renderRadar(); renderPanels(); markSeg(); }
document.getElementById('foot').innerHTML = 'Fuente: ' + esc(DATA.fuente) + ' &middot; Corte fuente ' + esc(DATA.corte) + ' &middot; Actualizado ' + esc(DATA.actualizado) + ' &middot; APPLUS+ ATIP Ca&ntilde;o Sur Este';
renderKPIs(); renderAll(); goToday();
</script>
</body></html>

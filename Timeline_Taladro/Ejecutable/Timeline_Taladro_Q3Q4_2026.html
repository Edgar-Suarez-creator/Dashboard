<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<title>Timeline Taladro · Q3-Q4 2026 · Caño Sur Este</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#02040a;--bg-1:#050916;--bg-2:#0a1024;
  --panel:rgba(15,22,45,.7);--stroke:rgba(70,211,255,.15);
  --text:#e8f9ff;--text-2:#96b5d4;--muted:#5a6b8a;
  --accent:#00d9ff;--accent-2:#a855f7;--good:#22ffb8;--warn:#ffb84a;--bad:#ff4d80;--brand:#ff8c42;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}
body{overflow-x:hidden}
.bg-aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(ellipse at top,#0a1a3a 0%,#050914 55%,#020408 100%)}
.bg-aurora::before,.bg-aurora::after{content:'';position:absolute;width:1400px;height:1400px;border-radius:50%;filter:blur(180px);opacity:.4;mix-blend-mode:screen;animation:float 26s ease-in-out infinite}
.bg-aurora::before{background:radial-gradient(circle,#00d9ff 0%,transparent 60%);top:-400px;left:-400px}
.bg-aurora::after{background:radial-gradient(circle,#a855f7 0%,transparent 60%);bottom:-500px;right:-400px;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(140px,-100px) scale(1.1)}66%{transform:translate(-120px,110px) scale(.9)}}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,217,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.03) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 85%)}

.hdr{padding:24px 40px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:40px;right:40px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
.hdr h1{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#fff 0%,var(--accent) 50%,var(--accent-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;text-shadow:0 0 30px rgba(0,217,255,.3)}
.hdr .sub{font-size:12px;color:var(--text-2);margin-top:6px;letter-spacing:1px}
.hdr .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(0,217,255,.08);border:1px solid rgba(0,217,255,.3);border-radius:99px;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hdr .badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good);animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

.filters{display:flex;flex-wrap:wrap;gap:10px;padding:12px 40px;align-items:center}
.filters .fld{display:flex;flex-direction:column;gap:4px;min-width:140px}
.filters label{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.3px;font-weight:700}
.filters select{background:rgba(10,20,40,.8);color:var(--text);border:1px solid rgba(0,217,255,.2);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;outline:none;font-family:inherit;min-width:140px}
.filters select:hover{border-color:rgba(0,217,255,.5)}
.filters .reset{background:linear-gradient(135deg,var(--bad),var(--brand));color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.8px;align-self:end}
.filters .reset:hover{transform:translateY(-1px)}

.legend{display:flex;flex-wrap:wrap;gap:12px;padding:4px 40px 12px;align-items:center;font-size:11px;color:var(--text-2)}
.legend b{color:var(--text);text-transform:uppercase;letter-spacing:1px;font-size:10px;margin-right:6px}
.legend-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(15,22,45,.6);border:1px solid var(--stroke);border-radius:99px;font-weight:600}
.legend-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.legend-item.PERFORACION{color:var(--accent)}
.legend-item.COMPLETAMIENTO{color:var(--good)}
.legend-item.CONEXIONADO{color:var(--warn)}
.legend-item.MOVILIZACION{color:var(--accent-2)}

/* ============ Panel Cluster Detallado ============ */
.cluster-panel{margin:16px 20px 24px;background:linear-gradient(160deg,rgba(0,217,255,.06),rgba(168,85,247,.04));border:1px solid rgba(0,217,255,.35);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(0,217,255,.15), inset 0 0 40px rgba(0,217,255,.05)}
.cluster-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#00d9ff,#a855f7,#22ffb8);opacity:.9}
.cluster-head{padding:20px 26px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:1px solid rgba(0,217,255,.2);background:linear-gradient(90deg,rgba(0,217,255,.08),transparent)}
.cluster-head .title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:800;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#00d9ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 20px rgba(0,217,255,.4)}
.cluster-head .meta{font-size:11px;color:var(--text-2);margin-top:4px;letter-spacing:1px}
.cluster-head .stats{display:flex;gap:10px;flex-wrap:wrap}
.cstat{padding:8px 14px;background:rgba(2,4,10,.6);border:1px solid rgba(0,217,255,.3);border-radius:8px;text-align:center;min-width:72px;backdrop-filter:blur(6px)}
.cstat .v{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:800;color:var(--accent);text-shadow:0 0 10px rgba(0,217,255,.5)}
.cstat .l{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}

.cluster-body{padding:20px 26px 26px}

/* Grid Vendor × Pozo */
.vendor-grid-wrap{overflow-x:auto;margin-top:14px;border-radius:10px;background:rgba(2,4,10,.4)}
.vendor-grid-wrap::-webkit-scrollbar{height:8px}
.vendor-grid-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}
.vgrid{border-collapse:separate;border-spacing:6px;padding:6px;min-width:100%}
.vgrid th{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);padding:10px 12px;text-align:center;background:rgba(0,217,255,.06);border-radius:8px;border:1px solid rgba(0,217,255,.15);text-shadow:0 0 6px rgba(0,217,255,.3)}
.vgrid th.pozo-h{text-align:left;color:var(--text)}
.vgrid td{padding:10px 12px;background:rgba(15,22,45,.6);border:1px solid var(--stroke);border-radius:8px;font-size:11px;color:var(--text);position:relative;transition:.2s}
.vgrid td:hover{background:rgba(0,217,255,.06);border-color:rgba(0,217,255,.4);transform:translateY(-2px)}
.vgrid td.pozo{background:linear-gradient(90deg,rgba(0,217,255,.1),rgba(0,217,255,.02));border-color:rgba(0,217,255,.3);font-weight:700;color:#fff;text-align:left;min-width:140px;font-family:'JetBrains Mono',monospace}
.vgrid td.pozo .cluster-lbl{font-size:9px;color:var(--text-2);font-weight:500;margin-top:2px;text-transform:uppercase;letter-spacing:1px;font-family:'Inter',sans-serif}

.vcell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.vcell .vname{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;color:currentColor;text-shadow:0 0 6px currentColor}
.vcell .vfecha{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text);font-weight:700;background:rgba(2,4,10,.6);padding:3px 8px;border-radius:5px;border:1px solid currentColor}
.vcell .vdias{font-size:9px;color:var(--text-2);letter-spacing:.5px}
.vcell.status-ok{color:var(--good)}
.vcell.status-warn{color:var(--warn)}
.vcell.status-late{color:var(--bad)}
.vcell.status-plan{color:var(--accent)}

.vendor-note{margin-top:14px;padding:12px 16px;background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.2);border-radius:8px;font-size:11.5px;color:var(--text-2);line-height:1.5}
.vendor-note b{color:var(--accent)}

.no-cluster{padding:14px 20px;margin:8px 20px 16px;background:rgba(255,184,74,.06);border:1px solid rgba(255,184,74,.2);border-radius:10px;font-size:12px;color:var(--text-2);text-align:center;letter-spacing:.5px}
.no-cluster b{color:var(--warn)}

/* ============ Resumen clústers ============ */
.clusters-summary{margin:12px 20px 20px;padding:16px 20px;background:rgba(15,22,45,.5);border:1px solid var(--stroke);border-radius:14px}
.clusters-summary .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.clusters-summary .title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);text-shadow:0 0 8px rgba(0,217,255,.4)}
.clusters-summary .hint{font-size:10.5px;color:var(--text-2);letter-spacing:.5px}
.cluster-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ccard{background:linear-gradient(135deg,rgba(0,217,255,.05),rgba(168,85,247,.03));border:1px solid var(--stroke);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.ccard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,217,255,.2)}
.ccard.active{background:linear-gradient(135deg,rgba(0,217,255,.15),rgba(168,85,247,.08));border-color:var(--accent);box-shadow:0 12px 30px rgba(0,217,255,.3), inset 0 0 20px rgba(0,217,255,.1)}
.ccard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--tal-color-c,var(--accent)),transparent);opacity:.8}
.ccard.tal-PW147{--tal-color-c:#00d9ff}
.ccard.tal-PW157{--tal-color-c:#a855f7}
.ccard.tal-IESCO{--tal-color-c:#22ffb8}
.ccard .cname{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:800;color:#fff;letter-spacing:.5px}
.ccard .cmeta{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:2px;display:flex;gap:8px;align-items:center}
.ccard .cmeta .tag-mod{padding:2px 6px;background:rgba(0,217,255,.15);color:var(--accent);border-radius:4px;font-size:9px;font-weight:700}
.ccard .cmeta .tag-tal{padding:2px 6px;background:rgba(255,255,255,.06);color:var(--text-2);border-radius:4px;font-size:9px;font-weight:700}
.ccard .pozos-list{margin-top:10px;font-size:11px;color:var(--text);line-height:1.7;max-height:130px;overflow-y:auto;padding-right:4px}
.ccard .pozos-list::-webkit-scrollbar{width:4px}
.ccard .pozos-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
.ccard .pozos-list .pz{display:inline-block;padding:3px 9px;margin:2px 4px 2px 0;background:rgba(2,4,10,.6);border:1px solid rgba(0,217,255,.25);border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:.3px}
.ccard .cbar{margin-top:8px;height:5px;border-radius:3px;background:rgba(2,4,10,.6);overflow:hidden;display:flex}
.ccard .cbar span{height:100%;box-shadow:0 0 8px currentColor}
.ccard .cbar .s-perf{background:var(--accent);color:var(--accent)}
.ccard .cbar .s-comp{background:var(--good);color:var(--good)}
.ccard .cbar .s-conx{background:var(--warn);color:var(--warn)}
.ccard .cbar .s-mov{background:var(--accent-2);color:var(--accent-2)}
.ccard .stats-row{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.ccard .stats-row span{display:flex;align-items:center;gap:3px}
.ccard .stats-row .d{width:6px;height:6px;border-radius:50%}

/* ============ Panel Taladro ============ */
.taladro-panel{margin:8px 20px 24px;background:linear-gradient(160deg,rgba(15,22,45,.6),rgba(10,16,36,.9));border:1px solid var(--stroke);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.taladro-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--tal-color,var(--accent)),transparent);opacity:.8}
.taladro-head{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--stroke);background:rgba(0,217,255,.03)}
.taladro-head .name{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--tal-color,var(--accent));text-shadow:0 0 14px var(--tal-color-glow,rgba(0,217,255,.5))}
.taladro-head .info{font-size:11px;color:var(--text-2);margin-top:3px;letter-spacing:.8px}
.taladro-kpis{display:flex;gap:8px;flex-wrap:wrap}
.tkpi{padding:6px 12px;background:rgba(10,20,40,.6);border:1px solid var(--stroke);border-radius:8px;text-align:center;min-width:64px}
.tkpi .v{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;color:var(--tal-color,var(--accent));text-shadow:0 0 10px var(--tal-color-glow,rgba(0,217,255,.4))}
.tkpi .l{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:700}

/* ============ Timeline con scroll horizontal ============ */
.tl-scroll-wrap{overflow-x:auto;overflow-y:visible;padding:0 0 12px;position:relative}
.tl-scroll-wrap::-webkit-scrollbar{height:10px}
.tl-scroll-wrap::-webkit-scrollbar-track{background:rgba(10,20,40,.5);border-radius:4px}
.tl-scroll-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}
.tl-scroll-wrap::-webkit-scrollbar-thumb:hover{background:linear-gradient(90deg,var(--accent-2),var(--accent))}

.timeline{position:relative;min-height:520px;padding:150px 30px 40px;box-sizing:content-box}
/* Header jerarquico: Año / Mes / Día */
.tl-year-row{position:absolute;top:20px;left:0;right:0;height:26px;pointer-events:none}
.tl-year{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(0,217,255,.14),rgba(168,85,247,.10));border:1px solid rgba(0,217,255,.35);border-radius:6px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:3px;text-shadow:0 0 10px rgba(0,217,255,.5)}
.tl-mo-row{position:absolute;top:52px;left:0;right:0;height:32px;pointer-events:none}
.tl-mo{position:absolute;top:0;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,217,255,.06);border:1px solid rgba(0,217,255,.2);border-radius:4px;color:var(--accent);font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;text-shadow:0 0 6px rgba(0,217,255,.4)}
.tl-mo:last-of-type{border-right:1px dashed rgba(0,217,255,.15)}
/* Días numerados */
.tl-day-row{position:absolute;top:92px;left:0;right:0;height:22px;pointer-events:none}
.tl-day{position:absolute;top:0;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--text-2);letter-spacing:.3px}
.tl-day.week-start{color:var(--accent);font-weight:800;font-size:10.5px;text-shadow:0 0 4px rgba(0,217,255,.5)}

/* Track eléctrico */
.tl-track{position:absolute;left:0;top:130px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(0,217,255,.08),rgba(168,85,247,.12),rgba(0,217,255,.08));box-shadow:0 0 25px var(--tal-color-glow,rgba(0,217,255,.3));z-index:1}
.tl-track::before{content:'';position:absolute;inset:0;border-radius:3px;background:linear-gradient(90deg,transparent 0%,var(--tal-color,#00e5ff) 20%,var(--tal-color-2,#a855f7) 50%,var(--tal-color,#00e5ff) 80%,transparent 100%);background-size:20% 100%;background-repeat:no-repeat;animation:currentFlow 4s linear infinite;filter:blur(1px);box-shadow:0 0 20px var(--tal-color,#00e5ff), 0 0 40px var(--tal-color-2,#a855f7)}
@keyframes currentFlow{0%{background-position:-20% 0%}100%{background-position:120% 0%}}

/* ============ Bandas de Clúster (debajo del track) ============ */
.tl-cluster-band{position:absolute;left:0;right:0;height:74px;pointer-events:none}
.tl-cluster-marker{position:absolute;top:-30px;width:1px;pointer-events:none}
/* Palito vertical desde el track hacia abajo hasta la banda */
.tl-cluster-stem{position:absolute;top:0;bottom:-4px;left:50%;transform:translateX(-50%);width:2px;background:linear-gradient(180deg,var(--cl-color),transparent);opacity:.6;pointer-events:none}
/* Bolita del clúster */
.tl-cluster-dot{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--cl-color);box-shadow:0 0 12px var(--cl-color), 0 0 24px var(--cl-color);pointer-events:auto;cursor:pointer;transition:.2s;z-index:6}
.tl-cluster-dot:hover{transform:translateX(-50%) scale(1.6)}
.tl-cluster-dot::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--cl-color);opacity:.4;animation:nodePulse 2s infinite}
@keyframes nodePulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.8);opacity:0}}
/* Nombre del clúster (alineado a la izquierda del punto para no salirse) */
.tl-cluster-name{position:absolute;top:10px;transform:translateX(-14px);font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;color:var(--cl-color);text-shadow:0 0 6px var(--cl-color);letter-spacing:1.5px;white-space:nowrap;pointer-events:auto;cursor:pointer;background:rgba(2,4,10,.75);padding:3px 10px;border:1px solid var(--cl-color);border-radius:5px;backdrop-filter:blur(4px)}
/* Linea horizontal que conecta todos los nodos del cluster (vendors + pozos) */
.tl-cluster-line{position:absolute;top:38px;height:2px;background:linear-gradient(90deg,var(--cl-color),var(--cl-color) 6px,transparent 6px,transparent 12px);background-size:12px 100%;opacity:.5;pointer-events:none}
/* Vendors como mini nodos con etiqueta corta (SDT, CCP, SCC, SUT) */
.tl-vendor{position:absolute;top:30px;transform:translateX(-50%);cursor:help;pointer-events:auto;z-index:6;text-align:center}
.tl-vendor .vdot{width:12px;height:12px;border-radius:3px;background:currentColor;box-shadow:0 0 8px currentColor;margin:0 auto;transition:.2s;transform:rotate(45deg)}
.tl-vendor:hover .vdot{transform:rotate(45deg) scale(1.6);box-shadow:0 0 14px currentColor, 0 0 28px currentColor}
.tl-vendor .vlbl{margin-top:6px;font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:800;color:currentColor;text-shadow:0 0 4px currentColor;letter-spacing:1px;white-space:nowrap}
.tl-vendor.HIT{color:#ff8c42}
.tl-vendor.SN{color:#00d9ff}
.tl-vendor.SL{color:#22ffb8}

/* Pozos individuales */
.tl-pozo{position:absolute;top:30px;transform:translate(-50%,0);cursor:pointer;pointer-events:auto;z-index:5;text-align:center}
.tl-pozo .pdot{width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;margin:0 auto;transition:.2s;border:2px solid rgba(2,4,10,.6)}
.tl-pozo:hover .pdot{transform:scale(1.6);box-shadow:0 0 16px currentColor, 0 0 32px currentColor}
.tl-pozo .plbl{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:15px;color:#fff;font-weight:800;letter-spacing:.5px;text-shadow:0 0 6px rgba(2,4,10,.98), 0 0 4px rgba(2,4,10,.95), 0 0 2px rgba(2,4,10,.9);line-height:1.15;white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg);transform-origin:center}
.tl-pozo.evt-PERFORACION{color:var(--accent)}
.tl-pozo.evt-COMPLETAMIENTO{color:var(--good)}
.tl-pozo.evt-CONEXIONADO{color:var(--warn)}
.tl-pozo.evt-MOVILIZACION{color:var(--accent-2)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(2,4,10,.85);backdrop-filter:blur(10px);z-index:998;opacity:0;pointer-events:none;transition:.25s}
.modal-back.open{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;width:min(720px,94vw);max-height:88vh;background:linear-gradient(160deg,#0a1024 0%,#050916 100%);border:1px solid var(--accent);border-radius:18px;z-index:999;transition:.25s cubic-bezier(.4,0,.2,1);box-shadow:0 30px 100px rgba(0,0,0,.85), 0 0 60px rgba(0,217,255,.3);display:flex;flex-direction:column;overflow:hidden}

const EVT_ICONS = {PERFORACION:'⚙',COMPLETAMIENTO:'✓',CONEXIONADO:'⚡',MOVILIZACION:'🚚',OTRO:'●'};

function detectModulo(r){
  const cod = (r.codigoProyecta || '').toUpperCase();
  if(cod.includes('ECU17049')) return 'M3';
  if(cod.includes('ECU21212')) return 'M4';
  if(cod.includes('ECU24091')) return 'M5';
  return '';
}

DATA.forEach(r=>{
  r.evtKey = normEvt(r.evento);
  r._date = new Date(r.fechaInicio + 'T00:00:00');
  r._ts = r._date.getTime();
  r._dayIdx = Math.round((r._date - Q_START) / DAY_MS);
  r._modulo = detectModulo(r);
  for(const t of TALADROS){ if(r.taladro.includes(t.match)){ r._tal = t.key; break; } }
  if(!r._tal) r._tal = 'OTRO';
});

const filterState = {modulo:'',taladro:'',cluster:'',evento:'',tipo:''};

function fillSelect(id, values){
  const sel = document.getElementById(id); const cur = sel.value;
  const opts = [...new Set(values.filter(v=>v))].sort();
  sel.innerHTML = '<option value="">Todos</option>' + opts.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if(opts.includes(cur)) sel.value = cur;
}
fillSelect('fCluster', DATA.map(x=>x.cluster));
fillSelect('fEvento', DATA.map(x=>x.evento));
fillSelect('fTipo', DATA.map(x=>x.tipoPozo));

['fModulo','fTaladro','fCluster','fEvento','fTipo'].forEach(id=>{
  const key = id.substring(1).toLowerCase();
  document.getElementById(id).addEventListener('change', e=>{ filterState[key] = e.target.value; renderAll(); });
});
function resetF(){
  Object.keys(filterState).forEach(k=>filterState[k]='');
  document.querySelectorAll('.filters select').forEach(s=>s.value='');
  document.getElementById('fCluster').value = '';
  document.getElementById('fModulo').value = '';
  renderAll();
}

function applyFilters(){
  return DATA.filter(r=>{
    if(filterState.modulo  && r._modulo !== filterState.modulo)  return false;
    if(filterState.taladro && r._tal    !== filterState.taladro) return false;
    if(filterState.cluster && r.cluster !== filterState.cluster) return false;
    if(filterState.evento  && r.evento  !== filterState.evento)  return false;
    if(filterState.tipo    && r.tipoPozo!== filterState.tipo)    return false;
    return true;
  });
}

/**
 * pxAtDay(dayIdx): posición X (px) del día dentro del track (0..TIMELINE_INNER_WIDTH)
 */
function pxAtDay(dayIdx){ return LEFT_PAD + dayIdx * PX_PER_DAY + PX_PER_DAY/2; }

// Vendors que entran ANTES de la primera perforacion del cluster.
// offsetDias: cuántos días antes del primer pozo. Regla: SDT muy temprano, luego CCP/SCC, luego SUT.
const VENDORS_CLUSTER = [
  {k:'HIT', name:'SDT', title:'HITACHI · Transformador SDT', offset:14},
  {k:'SN',  name:'CCP', title:'SCHNEIDER · Control CCP',      offset:10},
  {k:'SN',  name:'SCC', title:'SCHNEIDER · Control SCC',      offset:7},
  {k:'SL',  name:'SUT', title:'SLACOL · Variador SUT/VDF',    offset:4}
];

function renderTaladro(tal, records){
  const perf = records.filter(x=>x.evtKey==='PERFORACION').length;
  const comp = records.filter(x=>x.evtKey==='COMPLETAMIENTO').length;
  const conx = records.filter(x=>x.evtKey==='CONEXIONADO').length;
  const mov  = records.filter(x=>x.evtKey==='MOVILIZACION').length;
  const pozos = new Set(records.map(x=>x.pozo).filter(Boolean)).size;
  const clus  = new Set(records.map(x=>x.cluster).filter(Boolean)).size;

  const styleVars = `--tal-color:${tal.color};--tal-color-2:${tal.color2};--tal-color-glow:${tal.glow}`;

  // Agrupar por cluster
  const byCluster = {};
  records.forEach(r=>{
    if(!r.cluster) return;
    if(!byCluster[r.cluster]) byCluster[r.cluster] = {name:r.cluster, records:[], firstTs:Infinity, byPozo:{}};
    byCluster[r.cluster].records.push(r);
    if(r._ts < byCluster[r.cluster].firstTs) byCluster[r.cluster].firstTs = r._ts;
    if(r.pozo){
      if(!byCluster[r.cluster].byPozo[r.pozo]) byCluster[r.cluster].byPozo[r.pozo] = [];
      byCluster[r.cluster].byPozo[r.pozo].push(r);
    }
  });
  const clusters = Object.values(byCluster).sort((a,b)=>a.firstTs-b.firstTs);

  // Altura total: track + cluster bands
  const BAND_H = 90;
  const TRACK_Y = 130;
  const contentH = TRACK_Y + 50 + clusters.length * BAND_H + 40;

  let html = `<div class="taladro-panel" style="${styleVars}">
    <div class="taladro-head">
      <div>
        <div class="name">${esc(tal.label)}</div>
        <div class="info">${esc(tal.hp)} · ${records.length} hitos · ${pozos} pozos · ${clus} clústeres</div>
      </div>
      <div class="taladro-kpis">
        <div class="tkpi"><div class="v">${fmtN(records.length)}</div><div class="l">Hitos</div></div>
        <div class="tkpi"><div class="v">${fmtN(perf)}</div><div class="l">Perforar</div></div>
        <div class="tkpi"><div class="v">${fmtN(comp)}</div><div class="l">Completar</div></div>
        <div class="tkpi"><div class="v">${fmtN(conx)}</div><div class="l">Conexion</div></div>
        <div class="tkpi"><div class="v">${fmtN(mov)}</div><div class="l">Moviliz.</div></div>
        <div class="tkpi"><div class="v">${fmtN(pozos)}</div><div class="l">Pozos</div></div>
      </div>
    </div>
    <div class="tl-scroll-wrap">
      <div class="timeline" style="width:${LEFT_PAD + TIMELINE_INNER_WIDTH + 60}px;min-height:${contentH}px">`;

  // Header jerarquico: Año / Mes / Día
  const yearLeft = LEFT_PAD; const yearWidth = TIMELINE_INNER_WIDTH;
  html += `<div class="tl-year-row"><div class="tl-year" style="left:${yearLeft}px;width:${yearWidth}px">📅 2026</div></div>`;

  html += '<div class="tl-mo-row">';
  MONTHS.forEach(m=>{
    const first = new Date(m.y, m.m-1, 1);
    const last  = new Date(m.y, m.m, 0);
    const startIdx = Math.max(0, Math.round((first - Q_START)/DAY_MS));
    const endIdx   = Math.min(TOTAL_DAYS-1, Math.round((last - Q_START)/DAY_MS));
    const left = LEFT_PAD + startIdx * PX_PER_DAY;
    const width = (endIdx - startIdx + 1) * PX_PER_DAY;
    html += `<div class="tl-mo" style="left:${left}px;width:${width}px">${m.name} · ${m.q}</div>`;
  });
  html += '</div>';

  // Días numerados: cada 2 días para no saturar
  html += '<div class="tl-day-row">';
  for(let d=0; d<TOTAL_DAYS; d+=2){
    const date = new Date(Q_START.getTime() + d*DAY_MS);
    const dd = date.getDate();
    const isWeekStart = (date.getDay() === 1); // lunes
    const cls = isWeekStart ? 'tl-day week-start' : 'tl-day';
    html += `<div class="${cls}" style="left:${pxAtDay(d)}px">${dd}</div>`;
  }
  html += '</div>';

  // Track eléctrico (posicionado inline para respetar LEFT_PAD)
  html += `<div class="tl-track" style="left:${LEFT_PAD}px;right:30px;width:auto"></div>`;

  if(records.length === 0){
    html += `<div style="position:absolute;top:200px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;letter-spacing:1px">— Sin hitos con los filtros aplicados —</div>`;
  }

  // Colores rotativos para las bandas de clúster (cielo azul, violeta, verde, ambar, cian, rosa)
  const CL_COLORS = ['#00d9ff','#a855f7','#22ffb8','#ffb84a','#ff8c42','#ff4d80','#38bdf8','#c084fc','#a3e635'];

  clusters.forEach((cl, cIdx)=>{
    const clColor = CL_COLORS[cIdx % CL_COLORS.length];
    const dayIdxs = cl.records.map(r=>r._dayIdx).filter(x=>x>=0 && x<=TOTAL_DAYS);
    if(dayIdxs.length === 0) return;
    const dMin = Math.min(...dayIdxs);
    const dMax = Math.max(...dayIdxs);
    // Fecha PERFORACION mas temprana como ancla para los vendors
    const perfDays = cl.records.filter(r=>r.evtKey==='PERFORACION').map(r=>r._dayIdx);
    const anchorDay = perfDays.length ? Math.min(...perfDays) : dMin;

    // Vendors: se colocan ANTES de la fecha ancla en la propia timeline
    const vendorDays = VENDORS_CLUSTER.map(v=>({...v, dayIdx: anchorDay - v.offset}));
    // Rango total del cluster (para posicionar bolita del cluster en el vendor mas temprano)
    const clusterMinDay = Math.min(dMin, ...vendorDays.map(v=>v.dayIdx));
    const clusterMaxDay = Math.max(dMax, ...vendorDays.map(v=>v.dayIdx));
    const xMin = pxAtDay(clusterMinDay);
    const xMax = pxAtDay(clusterMaxDay);

    const bandTop = TRACK_Y + 20 + cIdx * BAND_H;
    html += `<div class="tl-cluster-band" style="top:${bandTop}px">`;
    // Marker vertical desde el track hasta la banda (con bolita)
    html += `<div class="tl-cluster-marker" style="left:${xMin}px;top:-${bandTop - TRACK_Y}px;height:${bandTop - TRACK_Y + 4}px;--cl-color:${clColor}">
      <div class="tl-cluster-stem" style="--cl-color:${clColor}"></div>
      <div class="tl-cluster-dot" data-cluster="${esc(cl.name)}" style="--cl-color:${clColor};top:${bandTop - TRACK_Y - 7}px"></div>
    </div>`;
    // Nombre del cluster arriba a la izquierda
    html += `<div class="tl-cluster-name" data-cluster="${esc(cl.name)}" style="left:${xMin}px;top:5px;--cl-color:${clColor};background:rgba(2,4,10,.75);color:${clColor};border-color:${clColor}">${esc(cl.name)}</div>`;
    // Linea horizontal punteada que conecta todos los nodos del cluster
    html += `<div class="tl-cluster-line" style="left:${xMin}px;width:${xMax - xMin}px;--cl-color:${clColor}"></div>`;

    // Vendors: mini nodos ANTES del primer pozo
    vendorDays.forEach(v=>{
      if(v.dayIdx < 0 || v.dayIdx > TOTAL_DAYS) return;
      const px = pxAtDay(v.dayIdx);
      html += `<div class="tl-vendor ${v.k}" style="left:${px}px" title="${esc(v.title)} · ${v.offset}d antes de perforación">
        <div class="vdot"></div>
        <div class="vlbl">${esc(v.name)}</div>
      </div>`;
    });

    // Pozos: cada evento como mini nodo con label solo del nombre limpio
    cl.records.slice().sort((a,b)=>a._ts-b._ts).forEach(r=>{
      const px = pxAtDay(r._dayIdx);
      // Nombre limpio: quitar "CAÑO SUR ESTE", "CAÑO SUR", "ESTE", "CUMANDAY", "MODULO N"
      let short = (r.pozo || '')
        .replace(/CAÑO\s+SUR\s+ESTE\s+MODULO\s+\d+/gi,'')
        .replace(/CAÑO\s+SUR\s+ESTE/gi,'')
        .replace(/CAÑO\s+SUR/gi,'')
        .replace(/\bESTE\b/gi,'')
        .replace(/\bCUMANDAY\b/gi,'')
        .replace(/\bMODULO\s+\d+\b/gi,'')
        .replace(/\s{2,}/g,' ')
        .trim();
      short = short.replace(/^[-·\s]+|[-·\s]+$/g,'').substring(0, 16);
      html += `<div class="tl-pozo evt-${r.evtKey}" style="left:${px}px" data-id="${DATA.indexOf(r)}" title="${esc(r.pozo)} · ${esc(r.evento)} · ${esc(r.fechaInicio)}">
        <div class="pdot"></div>
        <div class="plbl">${esc(short)}</div>
      </div>`;
    });
    html += '</div>';
  });

  html += '</div></div></div>';

  const container = document.createElement('div');
  container.innerHTML = html;
  container.querySelectorAll('.tl-pozo').forEach(el=>{
    el.addEventListener('click', ()=>openModal(DATA[+el.getAttribute('data-id')]));
  });
  container.querySelectorAll('.tl-cluster-dot, .tl-cluster-name').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cl = el.getAttribute('data-cluster');
      filterState.cluster = (filterState.cluster === cl) ? '' : cl;
      document.getElementById('fCluster').value = filterState.cluster;
      renderAll();
    });
  });
  return container.firstElementChild;
}

function nodeColor(evt){
  return {PERFORACION:'#00d9ff',COMPLETAMIENTO:'#22ffb8',CONEXIONADO:'#ffb84a',MOVILIZACION:'#a855f7'}[evt] || '#5a6b8a';
}

/* ================ Vendors por Clúster ================
Regla derivada del esquemático M4:
Cada clúster necesita entrada secuencial de vendors ANTES de perforar/completar:
  Hitachi (SDT)      → -60 días antes de la 1ra PERFORACIÓN del clúster
  Schneider CCP      → -45 días antes
  Schneider SCC      → -35 días antes
  SLACOL (SUT/VDF)   → -25 días antes  (uno por pozo)
Cuando llegue data real de vendors, aquí se reemplaza por lecturas del Excel.
*/
const VENDORS = [
  {key:'HIT',   nombre:'HITACHI',       alcance:'SDT',        offset:60, color:'#ff8c42'},
  {key:'SNCCP', nombre:'SCHNEIDER',     alcance:'CCP',        offset:45, color:'#00d9ff'},
  {key:'SNSCC', nombre:'SCHNEIDER',     alcance:'SCC',        offset:35, color:'#a855f7'},
  {key:'SLACOL',nombre:'SLACOL',        alcance:'SUT / VDF',  offset:25, color:'#22ffb8'}
];

const TODAY = new Date('2026-08-04T00:00:00');
function daysBetween(a,b){ return Math.round((b-a)/DAY_MS); }
function addDays(date, n){ const d = new Date(date.getTime()); d.setDate(d.getDate()+n); return d; }
function fmtDate(d){
  const yy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}

function renderClusterDetail(){

    return;
  }
  const recs = DATA.filter(r=>r.cluster === clu);
  if(recs.length === 0){ cont.innerHTML = ''; return; }
  // Pozos únicos del clúster
  const pozosMap = {};
  recs.forEach(r=>{
    if(!r.pozo) return;
    if(!pozosMap[r.pozo]) pozosMap[r.pozo] = {pozo:r.pozo, uwi:r.uwi, tipoPozo:r.tipoPozo, taladro:r.taladro, hitos:[]};
    pozosMap[r.pozo].hitos.push(r);
  });
  const pozos = Object.values(pozosMap).sort((a,b)=>a.pozo.localeCompare(b.pozo));
  // Fecha de perforación (o el hito más temprano) del clúster
  const firstDate = new Date(Math.min(...recs.map(r=>r._ts)));
  const firstPerf = recs.filter(r=>r.evtKey==='PERFORACION').sort((a,b)=>a._ts-b._ts)[0];
  const anchorDate = firstPerf ? firstPerf._date : firstDate;
  const taladros = [...new Set(recs.map(r=>r.taladro))];

  let html = `<div class="cluster-panel">
    <div class="cluster-head">
      <div>
        <div class="title">🔷 CLÚSTER ${esc(clu)}</div>
        <div class="meta">${esc(taladros.join(' · '))} · Ancla de programación: ${fmtDate(anchorDate)} (1ra Perforación del clúster)</div>
      </div>
      <div class="stats">
        <div class="cstat"><div class="v">${pozos.length}</div><div class="l">Pozos</div></div>
        <div class="cstat"><div class="v">${recs.length}</div><div class="l">Hitos</div></div>
        <div class="cstat"><div class="v">${VENDORS.length}</div><div class="l">Vendors</div></div>
        <div class="cstat"><div class="v">${fmtDate(firstDate).substring(5)}</div><div class="l">Primer hito</div></div>
      </div>
    </div>
    <div class="cluster-body">
      <div style="font-size:11px;color:var(--text-2);letter-spacing:.8px;margin-bottom:6px"><b style="color:var(--accent)">MATRIZ VENDOR × POZO</b> — fecha requerida de entrada al sitio (proyectada desde la ancla del clúster)</div>
      <div class="vendor-grid-wrap"><table class="vgrid">
        <thead><tr><th class="pozo-h">POZO</th>`;
  VENDORS.forEach(v=>{ html += `<th style="color:${v.color};text-shadow:0 0 6px ${v.color}88">${esc(v.nombre)}<br><span style="font-size:8.5px;opacity:.7;letter-spacing:1px">${esc(v.alcance)}</span></th>`; });
  html += '</tr></thead><tbody>';

  pozos.forEach(p=>{
    // fecha ancla del pozo = fecha de perforación de este pozo si existe, si no la ancla del clúster
    const pozoHitos = p.hitos.sort((a,b)=>a._ts-b._ts);
    const perfPozo = pozoHitos.find(h=>h.evtKey==='PERFORACION');
    const ancla = perfPozo ? perfPozo._date : anchorDate;
    html += `<tr><td class="pozo">${esc(p.pozo)}<div class="cluster-lbl">${esc(p.tipoPozo||'')} · ${esc(p.taladro||'').split('-')[0].trim()}</div></td>`;
    VENDORS.forEach(v=>{
      const fVendor = addDays(ancla, -v.offset);
      const diasDesdeHoy = daysBetween(TODAY, fVendor);
      let status = 'plan';
      let sublbl = '';
      if(diasDesdeHoy < 0){ status = diasDesdeHoy < -14 ? 'ok' : 'ok'; sublbl = `hace ${-diasDesdeHoy}d`; }
      else if(diasDesdeHoy <= 7){ status = 'late'; sublbl = `en ${diasDesdeHoy}d ⚠`; }
      else if(diasDesdeHoy <= 21){ status = 'warn'; sublbl = `en ${diasDesdeHoy}d`; }
      else { status = 'plan'; sublbl = `en ${diasDesdeHoy}d`; }
      html += `<td><div class="vcell status-${status}" style="color:${v.color}">
        <div class="vname">${esc(v.alcance)}</div>
        <div class="vfecha">${fmtDate(fVendor)}</div>
        <div class="vdias">${sublbl}</div>
      </div></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += `<div class="vendor-note">📋 <b>Reglas de proyección</b> (basadas en el esquemático de clúster M4):
  <br>• <b>HITACHI</b> debe entregar SDT ~60 días antes de perforación
  <br>• <b>SCHNEIDER CCP</b> ingresa a comisionamiento ~45 días antes (contrato 3032969-2021-005)
  <br>• <b>SCHNEIDER SCC</b> ingresa ~35 días antes (subsistema control complementario)
  <br>• <b>SLACOL</b> instala SUT/VDF por pozo ~25 días antes
  <br>Cuando llegue la data real de programación por vendor, estos valores se reemplazan.
  <br><b style="color:var(--good)">Verde</b> = ya debía haber entrado · <b style="color:var(--warn)">Amarillo</b> = próximos 21d · <b style="color:var(--bad)">Rojo</b> = urgente ≤7d</div>`;
  html += '</div></div>';
  cont.innerHTML = html;
}

function renderClustersSummary(){
  const cont = document.getElementById('clusters-summary');
  // Aplicar solo filtros que NO sean el de clúster (para que siempre se muestren todos los del scope actual)
  const scope = DATA.filter(r=>{
    if(filterState.modulo  && r._modulo !== filterState.modulo) return false;
    if(filterState.taladro && r._tal    !== filterState.taladro)return false;
    if(filterState.evento  && r.evento  !== filterState.evento) return false;
    if(filterState.tipo    && r.tipoPozo!== filterState.tipo)   return false;
    return true;
  });
  const byClus = {};
  scope.forEach(r=>{
    if(!r.cluster) return;
    if(!byClus[r.cluster]) byClus[r.cluster] = {cluster:r.cluster, pozos:new Set(), taladros:new Set(), modulos:new Set(), perf:0, comp:0, conx:0, mov:0, total:0};
    const c = byClus[r.cluster];
    if(r.pozo) c.pozos.add(r.pozo);
    if(r.taladro) c.taladros.add(r.taladro);
    if(r._modulo) c.modulos.add(r._modulo);
    if(r.evtKey==='PERFORACION') c.perf++;
    else if(r.evtKey==='COMPLETAMIENTO') c.comp++;
    else if(r.evtKey==='CONEXIONADO') c.conx++;
    else if(r.evtKey==='MOVILIZACION') c.mov++;
    c.total++;
    if(!c._tal) for(const t of TALADROS){ if(r.taladro.includes(t.match)){ c._tal = t.key; break; } }
  });
  const clusters = Object.values(byClus).sort((a,b)=>a.cluster.localeCompare(b.cluster));
  if(clusters.length === 0){ cont.innerHTML = ''; return; }

  let html = `<div class="clusters-summary">
    <div class="head">
      <div class="title">🔷 RESUMEN CLÚSTERS (${clusters.length})</div>
      <div class="hint">Clic en una tarjeta para filtrar y ver la matriz vendor × pozo</div>
    </div>
    <div class="cluster-cards">`;
  function cleanPozoName(p){
    return String(p||'')
      .replace(/CAÑO\s+SUR\s+ESTE\s+MODULO\s+\d+/gi,'')
      .replace(/CAÑO\s+SUR\s+ESTE/gi,'')
      .replace(/CAÑO\s+SUR/gi,'')
      .replace(/\bESTE\b/gi,'')
      .replace(/\bCUMANDAY\b/gi,'')
      .replace(/\bMODULO\s+\d+\b/gi,'')
      .replace(/\s{2,}/g,' ')
      .replace(/^[-·\s]+|[-·\s]+$/g,'')
      .trim();
  }
  clusters.forEach(c=>{
    const isActive = filterState.cluster === c.cluster;
    const pozosArr = [...c.pozos].sort();
    const total = c.total || 1;
    const wPerf = (c.perf/total*100).toFixed(1);
    const wComp = (c.comp/total*100).toFixed(1);
    const wConx = (c.conx/total*100).toFixed(1);
    const wMov  = (c.mov /total*100).toFixed(1);
    const modLabels = [...c.modulos].join(' · ') || '—';
    const talShort = [...c.taladros].map(t=>t.split(' - ')[0].replace('Petroworks','PW')).join(', ') || '—';
    html += `<div class="ccard tal-${c._tal||''} ${isActive?'active':''}" data-cluster="${esc(c.cluster)}">
      <div class="cname">${esc(c.cluster)}</div>
      <div class="cmeta"><span class="tag-mod">${esc(modLabels)}</span><span class="tag-tal">${esc(talShort)}</span><span>· ${c.pozos.size} pozos · ${c.total} hitos</span></div>
      <div class="pozos-list">${pozosArr.map(p=>`<span class="pz" title="${esc(p)}">${esc(cleanPozoName(p))}</span>`).join('')}</div>
      <div class="cbar">${wPerf>0?`<span class="s-perf" style="width:${wPerf}%"></span>`:''}${wComp>0?`<span class="s-comp" style="width:${wComp}%"></span>`:''}${wConx>0?`<span class="s-conx" style="width:${wConx}%"></span>`:''}${wMov>0?`<span class="s-mov" style="width:${wMov}%"></span>`:''}</div>
      <div class="stats-row">
        <span><span class="d" style="background:var(--accent)"></span>Perf ${c.perf}</span>
        <span><span class="d" style="background:var(--good)"></span>Comp ${c.comp}</span>
        <span><span class="d" style="background:var(--warn)"></span>Conx ${c.conx}</span>
        <span><span class="d" style="background:var(--accent-2)"></span>Mov ${c.mov}</span>
      </div>
    </div>`;
  });
  html += '</div></div>';
  cont.innerHTML = html;
  cont.querySelectorAll('.ccard').forEach(el=>{
    el.addEventListener('click', ()=>{
      const cl = el.getAttribute('data-cluster');
      filterState.cluster = (filterState.cluster === cl) ? '' : cl;
      document.getElementById('fCluster').value = filterState.cluster;
      renderAll();
    });
  });
}

function renderAll(){
  const f = applyFilters();
  renderClustersSummary();
  const cont = document.getElementById('taladros-container');
  cont.innerHTML = '';
  TALADROS.forEach(tal=>{
    if(filterState.taladro && filterState.taladro !== tal.key) return;
    const recs = f.filter(r=>r._tal === tal.key);
    cont.appendChild(renderTaladro(tal, recs));
  });
}

function openModal(r){
  document.getElementById('modalTitle').textContent = (EVT_ICONS[r.evtKey]||'●') + '  ' + (r.pozo||'—');
  document.getElementById('modalSub').textContent = (r.evento||'—') + ' · ' + (r.intervencion||'—');
  const evtColor = nodeColor(r.evtKey);
  let html = `<div class="modal-hero" style="border-color:${evtColor}44">
    <div>
      <div class="l">${esc(r.evento)}</div>
      <div class="big" style="color:${evtColor};text-shadow:0 0 16px ${evtColor}88">${esc(r.pozo||'—')}</div>
      <div style="font-size:11px;color:var(--text-2);margin-top:4px">${esc(r.uwi||'')}</div>
    </div>
    <div>
      <div class="r-badge" style="background:${evtColor}22;color:${evtColor};border:1px solid ${evtColor}66">${esc(r.intervencion||'—')}</div>
    </div>
  </div>`;
  html += '<div class="detail-grid">';
  [['Proyecto', (r.codigoProyecta||'') + (r.proyecto ? ' · ' + r.proyecto : '')],['Campo', r.campo],['Clúster', r.cluster],
   ['Taladro', r.taladro],['Tipo Equipo', r.tipoEquipo],['Tipo Pozo', r.tipoPozo],['Clasificación', r.clasificacion],['HUB', r.hub]
  ].forEach(([k,v])=>{ if(v) html += `<div class="detail-item"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; });
  html += '</div>';
  html += `<div class="detail-fechas">
    <div><div class="k">Plan táctico · Inicio</div><div class="v">${esc(r.planInicio||'—')}</div></div>
    <div><div class="k">Plan táctico · Fin</div><div class="v">${esc(r.planFin||'—')}</div></div>
    <div><div class="k">Real / Proy · Inicio</div><div class="v real">${esc(r.realInicio||'—')}</div></div>
    <div><div class="k">Real / Proy · Fin</div><div class="v real">${esc(r.realFin||'—')}</div></div>
  </div>`;
  if(r.obs) html += `<div class="detail-obs"><b>Obs:</b> ${esc(r.obs)}</div>`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalBack').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); document.getElementById('modalBack').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

renderAll();
</script>
</body></html>

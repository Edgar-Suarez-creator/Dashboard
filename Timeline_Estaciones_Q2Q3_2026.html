<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<title>Timeline Estaciones Q2-Q3 2026 - Cano Sur Este</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg-0:#02040a;--bg-1:#050916;--bg-2:#0a1024;
  --panel:rgba(15,22,45,.7);--stroke:rgba(70,211,255,.15);
  --text:#e8f9ff;--text-2:#96b5d4;--muted:#5a6b8a;
  --accent:#00d9ff;--accent-2:#a855f7;--good:#22ffb8;--warn:#ffb84a;--bad:#ff4d80;--brand:#ff8c42;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}
body{overflow-x:hidden}
.bg-aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(ellipse at top,#0a1a3a 0%,#050914 55%,#020408 100%)}
.bg-aurora::before,.bg-aurora::after{content:'';position:absolute;width:1400px;height:1400px;border-radius:50%;filter:blur(180px);opacity:.4;mix-blend-mode:screen;animation:float 26s ease-in-out infinite}
.bg-aurora::before{background:radial-gradient(circle,#00d9ff 0%,transparent 60%);top:-400px;left:-400px}
.bg-aurora::after{background:radial-gradient(circle,#a855f7 0%,transparent 60%);bottom:-500px;right:-400px;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(140px,-100px) scale(1.1)}66%{transform:translate(-120px,110px) scale(.9)}}
.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,217,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,217,255,.03) 1px,transparent 1px);background-size:70px 70px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 85%)}

.hdr{padding:24px 40px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:40px;right:40px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.5}
.hdr h1{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#fff 0%,var(--accent) 50%,var(--accent-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;text-shadow:0 0 30px rgba(0,217,255,.3)}
.hdr .sub{font-size:12px;color:var(--text-2);margin-top:6px;letter-spacing:1px}
.hdr .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(0,217,255,.08);border:1px solid rgba(0,217,255,.3);border-radius:99px;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hdr .badge::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good);animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

.aliados-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 40px 8px}
@media(max-width:1400px){.aliados-bar{grid-template-columns:repeat(2,1fr)}}
.acard{background:linear-gradient(135deg,rgba(20,30,60,.7),rgba(15,22,45,.85));border:1px solid rgba(0,217,255,.15);border-radius:12px;padding:12px 16px;position:relative;overflow:hidden;transition:.3s cubic-bezier(.4,0,.2,1);cursor:pointer}
.acard:hover{transform:translateY(-3px);border-color:currentColor;box-shadow:0 14px 40px currentColor}
.acard.active{border-color:currentColor;box-shadow:0 14px 40px currentColor}
.acard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:currentColor;opacity:.85}
.acard .an{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:1.5px;color:currentColor;text-shadow:0 0 10px currentColor;text-transform:uppercase}
.acard .as{font-size:9.5px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:3px;font-weight:600}
.acard .av{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:800;color:#fff;margin-top:6px;font-variant-numeric:tabular-nums}
.acard .avl{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.3px;font-weight:700;margin-top:1px}
.acard .mini-bar{margin-top:6px;height:4px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden}
.acard .mini-bar .fill{height:100%;background:currentColor;border-radius:2px;box-shadow:0 0 6px currentColor;transition:width .5s}

.filters{display:flex;flex-wrap:wrap;gap:10px;padding:12px 40px;align-items:end}
.filters .fld{display:flex;flex-direction:column;gap:4px;min-width:170px}
.filters label{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.3px;font-weight:700}
.filters select,.filters input[type=text]{background:rgba(10,20,40,.8);color:var(--text);border:1px solid rgba(0,217,255,.2);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;outline:none;font-family:inherit}
.filters .reset{background:linear-gradient(135deg,var(--bad),var(--brand));color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.8px}

.leyenda{padding:8px 40px 20px;display:flex;gap:20px;flex-wrap:wrap;font-size:11px;color:var(--text-2)}
.leyenda .item{display:flex;align-items:center;gap:6px}
.leyenda .swatch{width:22px;height:12px;border-radius:3px;background:currentColor;opacity:.7}

.aliado-panel{margin:8px 20px 24px;background:linear-gradient(160deg,rgba(15,22,45,.6),rgba(10,16,36,.9));border:1px solid var(--stroke);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.aliado-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--al-color,var(--accent)),transparent);opacity:.85}
.aliado-head{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--stroke);background:rgba(0,217,255,.03);flex-wrap:wrap}
.aliado-head .name{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--al-color,var(--accent));text-shadow:0 0 12px var(--al-color-glow,rgba(0,217,255,.5))}
.aliado-head .info{font-size:11px;color:var(--text-2);margin-top:3px;letter-spacing:.8px}
.aliado-kpis{display:flex;gap:8px;flex-wrap:wrap}
.akpi{padding:6px 12px;background:rgba(10,20,40,.6);border:1px solid var(--stroke);border-radius:8px;text-align:center;min-width:60px}
.akpi .v{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:800;color:var(--al-color,var(--accent))}
.akpi .l{font-size:9px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.tl-scroll-wrap{overflow-x:auto;overflow-y:visible;padding:0 0 12px}
.tl-scroll-wrap::-webkit-scrollbar{height:10px}
.tl-scroll-wrap::-webkit-scrollbar-track{background:rgba(10,20,40,.5);border-radius:4px}
.tl-scroll-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px}

.timeline{position:relative;padding:150px 30px 40px;box-sizing:content-box}
.tl-year-row{position:absolute;top:20px;left:0;right:0;height:26px;pointer-events:none}
.tl-year{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(0,217,255,.14),rgba(168,85,247,.10));border:1px solid rgba(0,217,255,.35);border-radius:6px;color:#fff;font-family:'Orbitron',sans-serif;font-size:12px;font-weight:800;letter-spacing:3px}
.tl-mo-row{position:absolute;top:52px;left:0;right:0;height:32px;pointer-events:none}
.tl-mo{position:absolute;top:0;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,217,255,.06);border:1px solid rgba(0,217,255,.2);border-radius:4px;color:var(--accent);font-family:'Orbitron',sans-serif;font-size:11px;font-weight:800;letter-spacing:2px}
.tl-day-row{position:absolute;top:92px;left:0;right:0;height:22px;pointer-events:none}
.tl-day{position:absolute;top:0;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;color:var(--text-2)}
.tl-day.week-start{color:var(--accent);font-weight:800;font-size:10.5px;text-shadow:0 0 4px rgba(0,217,255,.5)}

.tl-track{position:absolute;left:0;top:130px;height:5px;border-radius:3px;background:linear-gradient(90deg,rgba(0,217,255,.08),rgba(168,85,247,.12),rgba(0,217,255,.08));box-shadow:0 0 25px var(--al-color-glow,rgba(0,217,255,.3));z-index:1}
.tl-track::before{content:'';position:absolute;inset:0;border-radius:3px;background:linear-gradient(90deg,transparent 0%,var(--al-color,#00e5ff) 20%,var(--al-color,#a855f7) 50%,var(--al-color,#00e5ff) 80%,transparent 100%);background-size:20% 100%;background-repeat:no-repeat;animation:currentFlow 4s linear infinite;filter:blur(1px);box-shadow:0 0 20px var(--al-color,#00e5ff)}
@keyframes currentFlow{0%{background-position:-20% 0%}100%{background-position:120% 0%}}

.tl-today{position:absolute;top:118px;bottom:20px;width:2px;background:linear-gradient(180deg,#ff4d80,transparent);z-index:2;box-shadow:0 0 12px #ff4d80}
.tl-today::before{content:'HOY';position:absolute;top:-14px;left:-14px;background:#ff4d80;color:#fff;padding:2px 6px;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;box-shadow:0 0 10px rgba(255,77,128,.6)}

.tl-act{position:absolute;height:24px;border-radius:6px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);z-index:5;overflow:visible;display:flex;align-items:center;padding:0 8px;border:1px solid currentColor}
.tl-act:hover{transform:translateY(-2px) scale(1.02);z-index:20;box-shadow:0 8px 24px currentColor;filter:brightness(1.15)}
.tl-act .abar-bg{position:absolute;inset:0;border-radius:5px;background:currentColor;opacity:.25}
.tl-act .abar-progress{position:absolute;top:0;left:0;bottom:0;border-radius:5px 0 0 5px;background:currentColor;opacity:.85;box-shadow:0 0 10px currentColor;transition:width .5s}
.tl-act .albl{position:relative;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 4px rgba(2,4,10,.95),0 0 3px rgba(2,4,10,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;flex:1;pointer-events:none}
.tl-act .apct{position:relative;font-family:'Orbitron',sans-serif;font-size:9.5px;color:#fff;font-weight:800;padding-left:6px;text-shadow:0 0 4px rgba(2,4,10,.9);pointer-events:none}
.tl-act.n1{height:28px}
.tl-act.n1 .albl{font-size:12px;font-weight:800}
.tl-act.n3{height:22px;opacity:.9}
.tl-act.n3 .albl{font-size:10.5px;font-weight:600}

.modal-back{position:fixed;inset:0;background:rgba(2,4,10,.85);backdrop-filter:blur(10px);z-index:998;opacity:0;pointer-events:none;transition:.25s}
.modal-back.open{opacity:1;pointer-events:auto}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;width:min(720px,94vw);max-height:88vh;background:linear-gradient(160deg,#0a1024 0%,#050916 100%);border:1px solid var(--accent);border-radius:18px;z-index:999;transition:.25s cubic-bezier(.4,0,.2,1);box-shadow:0 30px 100px rgba(0,0,0,.85), 0 0 60px rgba(0,217,255,.3);display:flex;flex-direction:column;overflow:hidden}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:linear-gradient(90deg,rgba(0,217,255,.14),rgba(168,85,247,.08));border-bottom:1px solid rgba(0,217,255,.25)}
.modal-head h2{font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(0,217,255,.6)}
.modal-head .sub{font-size:11px;color:var(--text-2);margin-top:4px;letter-spacing:.8px}
.modal-close{background:rgba(255,77,128,.14);border:1px solid rgba(255,77,128,.4);color:#ff8fb0;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{background:rgba(255,77,128,.24);transform:rotate(90deg)}
.modal-body{padding:20px 24px 24px;overflow-y:auto;flex:1}
.modal-hero{padding:14px 18px;margin-bottom:18px;background:linear-gradient(135deg,rgba(0,217,255,.06),rgba(168,85,247,.03));border:1px solid rgba(0,217,255,.25);border-radius:12px}
.modal-hero .desc{font-family:'JetBrains Mono',monospace;font-size:13px;color:#fff;font-weight:600;line-height:1.5}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 20px;margin-top:14px}
.detail-item{padding:10px 14px;background:rgba(15,22,45,.5);border:1px solid var(--stroke);border-radius:8px}
.detail-item .k{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:2px}
.detail-item .v{font-size:13px;color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace}
.progress-block{margin-top:16px;padding:14px 16px;background:rgba(15,22,45,.5);border:1px solid var(--stroke);border-radius:10px}
.progress-block .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:var(--text-2)}
.progress-block .bar{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-top:4px;position:relative}
.progress-block .bar .p{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .5s}
.progress-block .bar .p.prog{background:var(--accent);opacity:.6}
.progress-block .bar .p.ejec{background:var(--good);box-shadow:0 0 8px var(--good)}
</style>

, "fin": "2026-08-01", "duracion": 99.0, "pctProg": 0.843973484848485, "pctEjec": 0.7702499999999999, "pronostico": "2026-08-13", "ruta": ""}, {"descripcion": "Adecuación Plataforma - CASE-0092", "nivel": 3, "comienzo": "2026-04-25", "fin": "2026-08-01", "duracion": 99.0, "pctProg": 0.843973484848485, "pctEjec": 0.7702499999999999, "pronostico": "2026-08-13", "ruta": ""}, {"descripcion": "CASE-0373 (6 CP)", "nivel": 2, "comienzo": "2026-08-01", "fin": "2026-11-20", "duracion": 112.0, "pctProg": 0.0, "pctEjec": 0.006, "pronostico": "2026-11-22", "ruta": ""}, {"descripcion": "Adecuación Plataforma - Clúster 15 CASE-0373", "nivel": 3, "comienzo": "2026-08-01", "fin": "2026-11-20", "duracion": 112.0, "pctProg": 0.0, "pctEjec": 0.006, "pronostico": "2026-11-22", "ruta": ""}, {"descripcion": "CASE-0391 (5 CP)", "nivel": 2, "comienzo": "2026-05-01", "fin": "2026-07-31", "duracion": 92.0, "pctProg": 0.8116515151515153, "pctEjec": 0.6665000000000001, "pronostico": "2026-08-20", "ruta": ""}, {"descripcion": "Adecuación Plataforma - Clúster 29 CASE-0391", "nivel": 3, "comienzo": "2026-05-01", "fin": "2026-07-31", "duracion": 92.0, "pctProg": 0.8116515151515153, "pctEjec": 0.6665000000000001, "pronostico": "2026-08-20", "ruta": ""}]}};
const Q_START = new Date('2026-04-01');
const Q_END   = new Date('2026-09-30');
const DAY_MS = 86400000;
const TODAY = new Date();
const TOTAL_DAYS = Math.round((Q_END - Q_START) / DAY_MS) + 1;
const PX_PER_DAY = 12;
const LEFT_PAD = 20;
const TIMELINE_INNER_WIDTH = TOTAL_DAYS * PX_PER_DAY;

const MONTHS = [
  {y:2026,m:4,name:'ABR', q:'Q2'},{y:2026,m:5,name:'MAY', q:'Q2'},{y:2026,m:6,name:'JUN', q:'Q2'},
  {y:2026,m:7,name:'JUL', q:'Q3'},{y:2026,m:8,name:'AGO', q:'Q3'},{y:2026,m:9,name:'SEP', q:'Q3'}
];

const fmtN = n=>new Intl.NumberFormat('es-CO').format(n);
const esc = s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pxAtDay = d => LEFT_PAD + d * PX_PER_DAY + PX_PER_DAY/2;

DATA.aliados.forEach((al, idx)=>{
  const color = DATA.colors[idx % DATA.colors.length];
  (DATA.todo[al]||[]).forEach(a=>{
    a._color = color;
    a._aliado = al;
    const di = new Date(a.comienzo + 'T00:00:00');
    const df = new Date(a.fin + 'T00:00:00');
    a._diDay = Math.max(0, Math.round((di - Q_START)/DAY_MS));
    a._dfDay = Math.min(TOTAL_DAYS-1, Math.round((df - Q_START)/DAY_MS));
  });
});

const filterState = {aliado:'', nivel:'', estado:'', search:''};

document.getElementById('fAliado').innerHTML = '<option value="">Todos</option>' + DATA.aliados.map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join('');

['fAliado','fNivel','fEstado'].forEach(id=>{
  const key = id.substring(1).toLowerCase();
  document.getElementById(id).addEventListener('change', e=>{ filterState[key] = e.target.value; renderAll(); });
});
document.getElementById('fSearch').addEventListener('input', e=>{ filterState.search = e.target.value.toLowerCase().trim(); renderAll(); });
function resetF(){
  Object.keys(filterState).forEach(k=>filterState[k]='');
  document.querySelectorAll('.filters select').forEach(s=>s.value='');
  document.getElementById('fSearch').value='';
  renderAll();
}

function applyFilters(list){
  return list.filter(a=>{
    if(filterState.nivel && String(a.nivel) !== filterState.nivel) return false;
    if(filterState.estado){
      const e = a.pctEjec || 0;
      const p = a.pctProg || 0;
      if(filterState.estado==='pendiente' && e > 0.01) return false;
      if(filterState.estado==='completa' && e < 0.99) return false;
      if(filterState.estado==='progreso' && (e <= 0.01 || e >= 0.99)) return false;
      if(filterState.estado==='ejec_bajo_prog' && (e >= p - 0.05)) return false;
    }
    if(filterState.search){
      const desc = (a.descripcion||'').toLowerCase();
      if(!desc.includes(filterState.search)) return false;
    }
    return true;
  });
}

function renderAliadosBar(){
  const cont = document.getElementById('aliados-bar');
  cont.innerHTML = DATA.aliados.map((al, idx)=>{
    const color = DATA.colors[idx % DATA.colors.length];
    const items = DATA.todo[al] || [];
    const total = items.length;
    const promEjec = items.length>0 ? items.reduce((s,a)=>s+(a.pctEjec||0),0)/items.length*100 : 0;
    const active = filterState.aliado === al;
    return '<div class="acard '+(active?'active':'')+'" data-aliado="'+esc(al)+'" style="color:'+color+'">'
      + '<div class="an">'+esc(al)+'</div>'
      + '<div class="as">Aliado</div>'
      + '<div class="av">'+fmtN(total)+'</div>'
      + '<div class="avl">Actividades &middot; '+promEjec.toFixed(0)+'% avance</div>'
      + '<div class="mini-bar"><div class="fill" style="width:'+promEjec.toFixed(0)+'%"></div></div>'
      + '</div>';
  }).join('');
  cont.querySelectorAll('.acard').forEach(el=>{
    el.addEventListener('click', ()=>{
      const al = el.getAttribute('data-aliado');
      filterState.aliado = (filterState.aliado === al) ? '' : al;
      document.getElementById('fAliado').value = filterState.aliado;
      renderAll();
    });
  });
}

function renderAliadoPanel(al, idx, filteredList){
  const color = DATA.colors[idx % DATA.colors.length];
  const glow = color + '55';
  const items = filteredList;
  const total = items.length;
  const completas = items.filter(a=>(a.pctEjec||0)>=0.99).length;
  const enProg = items.filter(a=>(a.pctEjec||0)>0.01 && (a.pctEjec||0)<0.99).length;
  const pendientes = total - completas - enProg;
  const promEjec = total>0 ? items.reduce((s,a)=>s+(a.pctEjec||0),0)/total*100 : 0;
  const atrasadas = items.filter(a=>((a.pctEjec||0) < (a.pctProg||0) - 0.05)).length;

  const styleVars = '--al-color:'+color+';--al-color-glow:'+glow;

  const sorted = items.slice().sort((a,b)=>a._diDay - b._diDay || a._dfDay - b._dfDay);
  const rowsUsed = [];
  sorted.forEach(a=>{
    let row = 0;
    while(row < rowsUsed.length && rowsUsed[row] >= a._diDay) row++;
    if(row === rowsUsed.length) rowsUsed.push(0);
    rowsUsed[row] = a._dfDay + 1;
    a._row = row;
  });
  const maxRow = Math.max(rowsUsed.length, 3);
  const BAR_TOP = 155;
  const ROW_H = 32;
  const contentH = BAR_TOP + maxRow * ROW_H + 40;

  let html = '<div class="aliado-panel" style="'+styleVars+'">'
    + '<div class="aliado-head">'
    +   '<div>'
    +     '<div class="name">&#127959; '+esc(al)+'</div>'
    +     '<div class="info">'+total+' actividades &middot; '+completas+' completas &middot; '+enProg+' en progreso &middot; '+pendientes+' pendientes &middot; '+atrasadas+' con atraso</div>'
    +   '</div>'
    +   '<div class="aliado-kpis">'
    +     '<div class="akpi"><div class="v">'+total+'</div><div class="l">Total</div></div>'
    +     '<div class="akpi"><div class="v">'+completas+'</div><div class="l">Compl.</div></div>'
    +     '<div class="akpi"><div class="v">'+enProg+'</div><div class="l">Progr.</div></div>'
    +     '<div class="akpi"><div class="v">'+atrasadas+'</div><div class="l">Atraso</div></div>'
    +     '<div class="akpi"><div class="v">'+promEjec.toFixed(0)+'%</div><div class="l">Avance</div></div>'
    +   '</div>'
    + '</div>'
    + '<div class="tl-scroll-wrap"><div class="timeline" style="width:'+(LEFT_PAD + TIMELINE_INNER_WIDTH + 40)+'px;min-height:'+contentH+'px">';

  html += '<div class="tl-year-row"><div class="tl-year" style="left:'+LEFT_PAD+'px;width:'+TIMELINE_INNER_WIDTH+'px">&#128197; 2026</div></div>';
  html += '<div class="tl-mo-row">';
  MONTHS.forEach(m=>{
    const first = new Date(m.y, m.m-1, 1);
    const last  = new Date(m.y, m.m, 0);
    const startIdx = Math.max(0, Math.round((first - Q_START)/DAY_MS));
    const endIdx   = Math.min(TOTAL_DAYS-1, Math.round((last - Q_START)/DAY_MS));
    const left = LEFT_PAD + startIdx * PX_PER_DAY;
    const width = (endIdx - startIdx + 1) * PX_PER_DAY;
    html += '<div class="tl-mo" style="left:'+left+'px;width:'+width+'px">'+m.name+' &middot; '+m.q+'</div>';
  });
  html += '</div>';
  html += '<div class="tl-day-row">';
  for(let d=0; d<TOTAL_DAYS; d+=2){
    const date = new Date(Q_START.getTime() + d*DAY_MS);
    const dd = date.getDate();
    const isWeekStart = (date.getDay() === 1);
    const cls = isWeekStart ? 'tl-day week-start' : 'tl-day';
    html += '<div class="'+cls+'" style="left:'+pxAtDay(d)+'px">'+dd+'</div>';
  }
  html += '</div>';
  html += '<div class="tl-track" style="width:'+(TIMELINE_INNER_WIDTH + 20)+'px"></div>';

  if(TODAY >= Q_START && TODAY <= Q_END){
    const todayIdx = Math.round((TODAY - Q_START)/DAY_MS);
    html += '<div class="tl-today" style="left:'+pxAtDay(todayIdx)+'px"></div>';
  }

  if(items.length === 0){
    html += '<div style="position:absolute;top:200px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:12px;letter-spacing:1px">&mdash; Sin actividades con los filtros aplicados &mdash;</div>';
  }

  sorted.forEach((a,i)=>{
    const x = pxAtDay(a._diDay) - PX_PER_DAY/2;
    const w = Math.max(28, (a._dfDay - a._diDay + 1) * PX_PER_DAY);
    const y = BAR_TOP + a._row * ROW_H;
    const pctE = ((a.pctEjec||0) * 100);
    const pctP = ((a.pctProg||0) * 100);
    const isCompleted = pctE >= 99;
    const isDelayed = pctE < pctP - 5;
    const barColor = isCompleted ? '#22ffb8' : (isDelayed ? '#ff4d80' : color);
    const maxChars = Math.max(3, Math.floor((w - 40) / 6.5));
    let lbl = a.descripcion.trim();
    if(lbl.length > maxChars) lbl = lbl.substring(0, maxChars-1) + '…';
    const tt = a.descripcion + ' | ' + a.comienzo + ' - ' + a.fin + ' | Prog ' + pctP.toFixed(0) + '% Ejec ' + pctE.toFixed(0) + '%';
    html += '<div class="tl-act n'+a.nivel+'" data-idx="'+i+'" data-al="'+esc(al)+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;color:'+barColor+'" title="'+esc(tt)+'">'
      + '<div class="abar-bg"></div>'
      + '<div class="abar-progress" style="width:'+pctE+'%"></div>'
      + '<div class="albl">'+esc(lbl)+'</div>'
      + '<div class="apct">'+pctE.toFixed(0)+'%</div>'
      + '</div>';
  });

  html += '</div></div></div>';
  const container = document.createElement('div');
  container.innerHTML = html;
  container.querySelectorAll('.tl-act').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.getAttribute('data-idx');
      openModal(sorted[i], el.getAttribute('data-al'));
    });
  });
  return container.firstElementChild;
}

function renderAll(){
  renderAliadosBar();
  const cont = document.getElementById('paneles-container');
  cont.innerHTML = '';
  DATA.aliados.forEach((al, idx)=>{
    if(filterState.aliado && filterState.aliado !== al) return;
    const list = applyFilters(DATA.todo[al] || []);
    cont.appendChild(renderAliadoPanel(al, idx, list));
  });
}

function openModal(a, aliado){
  document.getElementById('modalTitle').textContent = aliado;
  document.getElementById('modalSub').textContent = 'Nivel ' + (a.nivel||'-') + ' · ' + (a.duracion?a.duracion+' dias':'-');
  let html = '<div class="modal-hero"><div class="desc">'+esc(a.descripcion)+'</div></div>';
  html += '<div class="detail-grid">';
  const items = [
    ['Comienzo', a.comienzo],
    ['Fin planeado', a.fin],
    ['Pronostico', a.pronostico || '-'],
    ['Duracion', a.duracion ? a.duracion + ' dias' : '-'],
    ['Nivel jerarquico', a.nivel],
    ['Ruta critica', a.ruta || '-']
  ];
  items.forEach(([k,v])=>{
    html += '<div class="detail-item"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';
  });
  html += '</div>';
  const pctP = ((a.pctProg||0)*100).toFixed(1);
  const pctE = ((a.pctEjec||0)*100).toFixed(1);
  const delta = ((a.pctEjec||0)-(a.pctProg||0))*100;
  html += '<div class="progress-block">'
    + '<div class="row"><span>Programado</span><span style="color:var(--accent);font-weight:800;font-family:Orbitron">'+pctP+'%</span></div>'
    + '<div class="bar"><div class="p prog" style="width:'+pctP+'%"></div></div>'
    + '<div class="row" style="margin-top:12px"><span>Ejecutado</span><span style="color:var(--good);font-weight:800;font-family:Orbitron">'+pctE+'%</span></div>'
    + '<div class="bar"><div class="p ejec" style="width:'+pctE+'%"></div></div>'
    + '<div class="row" style="margin-top:12px"><span>&Delta; Ejecutado - Programado</span><span style="color:'+(delta<0?'var(--bad)':'var(--good)')+';font-weight:800;font-family:Orbitron">'+(delta>0?'+':'')+delta.toFixed(1)+'%</span></div>'
    + '</div>';
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalBack').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); document.getElementById('modalBack').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

renderAll();
</script>
